<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Inicio de Sesión
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body class="
d-flex
flex-column
min-vh-100
">

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- CONTENIDO -->
<div class="
container
mt-5
flex-grow-1
">

<h2 class="
text-center
text-primary
fw-bold
">

Iniciar Sesión

</h2>

<form

id="formularioLogin"

class="
p-4
bg-white
shadow
rounded
mt-4
"

style="
max-width:450px;
margin:auto;
"

>

<div class="mb-3">

<label class="form-label">

Correo electrónico

</label>

<input

type="email"

id="correo"

name="email"

autocomplete="email"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">

Contraseña

</label>

<input

type="password"

id="contrasena"

name="password"

autocomplete="current-password"

class="form-control"

required

>

</div>

<button class="
btn
btn-primary
w-100
">

Ingresar

</button>

<p class="
text-center
mt-3
">

¿No tienes cuenta?

<a href="registro.html">

Regístrate aquí

</a>

</p>

<div

id="mensaje"

class="
text-center
mt-3
"

></div>

</form>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

document.getElementById(
'formularioLogin'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const correo =
document.getElementById(
'correo'
).value;

const contrasena =
document.getElementById(
'contrasena'
).value;

const respuesta =
await fetch(

'http://localhost:3000/login',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

correo,
contrasena

})

}

);

const datos =
await respuesta.json();

const mensaje =
document.getElementById(
'mensaje'
);

if(datos.ok){

mensaje.innerHTML = `

<div class="
alert
alert-success
">

Bienvenido
${datos.usuario.nombre}

</div>

`;

setTimeout(()=>{

/* SUPERADMIN */
if(
datos.usuario.rol ===
'superadmin'
){

window.location.href =
'panel_superadmin.html';

}

/* EMPRENDEDOR */
else if(
datos.usuario.rol ===
'emprendedor'
){

window.location.href =
'panel.html';

}

/* USUARIO NORMAL */
else{

window.location.href =
'index.html';

}

},1500);

}

else{

mensaje.innerHTML = `

<div class="
alert
alert-danger
">

${datos.mensaje}

</div>

`;

}

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>

</html>
