const respuesta =

'http://localhost:3000/usuario'

async function mostrarUsuarios(){

document.getElementById(
'contenidoAdmin'
);

contenido.innerHTML = `

<h2 class="
titulo-panel
mb-4
">

Gestión de Usuarios

</h2>

<div class="
card
card-admin
p-4
">

<div class="
table-responsive
">

<table class="
table
table-hover
align-middle
">

<thead class="
table-primary
">

<tr>

<th>ID</th>
<th>Nombre</th>
<th>Correo</th>
<th>Rol</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaUsuarios">

<tr>

<td colspan="5" class="text-center">

Cargando usuarios...

</td>

</tr>

</tbody>

</table>

</div>

`;

/* FETCH */
const respuesta =
await fetch(

'http://localhost:3000/usuarios-admin'

);

const datos =
await respuesta.json();

if(!datos.ok){

contenido.innerHTML = `

<div class="
alert
alert-danger
">

Error al cargar usuarios

</div>

`;

return;

}

let html = '';

datos.usuarios.forEach(usuario=>{

html += `

<tr>

<td>
${usuario.id}
</td>

<td>
${usuario.nombre}
</td>

<td>
${usuario.correo}
</td>

<td>

<span class="
badge
bg-primary
">

${usuario.rol}

</span>

</td>

<td>

<select

class="
form-select
form-select-sm
mb-2
"

onchange="
cambiarRol(
${usuario.id},
this.value
)
"

>

<option
value="usuario"

${usuario.rol === 'usuario'
? 'selected'
: ''
}

>

Usuario

</option>

<option
value="emprendedor"

${usuario.rol === 'emprendedor'
? 'selected'
: ''
}

>

Emprendedor

</option>

<option
value="admin"

${usuario.rol === 'admin'
? 'selected'
: ''
}

>

Admin

</option>

<option
value="superadmin"

${usuario.rol === 'superadmin'
? 'selected'
: ''
}

>

SuperAdmin

</option>

</select>

<button

class="
btn
btn-danger
btn-sm
"

onclick="
eliminarUsuario(
${usuario.id}
)
"

>

Eliminar

</button>

</td>

</tr>

`;

});

document.getElementById(
'tablaUsuarios'
).innerHTML = html;

}

/* =====================================
   CAMBIAR ROL
===================================== */

async function cambiarRol(
id,
rol
){

const respuesta =
await fetch(

'http://localhost:3000/cambiar-rol',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

id,
rol

})

}

);

const datos =
await respuesta.json();

if(datos.ok){

alert(
'Rol actualizado'
);

}

else{

alert(
'Error al actualizar rol'
);

}

}

/* =====================================
   ELIMINAR USUARIO
===================================== */

async function eliminarUsuario(
id
){

const confirmar =
confirm(

'¿Eliminar usuario?'

);

if(!confirmar){

return;

}

const respuesta =
await fetch(

'http://localhost:3000/eliminar-usuario',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

id

})

}

);

const datos =
await respuesta.json();

if(datos.ok){

alert(
'Usuario eliminado'
);

mostrarUsuarios();

}

else{

alert(

datos.mensaje ||

'Error al eliminar'

);

}

}

/* =====================================
   ELIMINAR EMPRENDIMIENTO
===================================== */

async function eliminarEmprendimiento(
id
){

const confirmar =
confirm(

'¿Eliminar emprendimiento?'

);

if(!confirmar){

return;

}

const respuesta =
await fetch(

'http://localhost:3000/eliminar-emprendimiento',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

id

})

}

);

const datos =
await respuesta.json();

if(datos.ok){

alert(
'Emprendimiento eliminado'
);

mostrarEmprendimientos();

}

else{

alert(
'Error al eliminar'
);

}

}

/* =====================================
   ACTIVIDAD RECIENTE
===================================== */

async function cargarActividad(){

const respuesta =
await fetch(

'http://localhost:3000/actividad-reciente'

);

const datos =
await respuesta.json();

if(!datos.ok){

return;

}

let html = '';

datos.actividades.forEach(act=>{

html += `

<li class="list-group-item">

🟢 ${act.texto}

</li>

`;

});

const actividadHTML =
document.getElementById(
'actividadReciente'
);

if(actividadHTML){

actividadHTML.innerHTML = html;

}

}
