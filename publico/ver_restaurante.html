<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ver Restaurante
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

.foto-restaurante{

width:100%;

max-width:700px;

height:auto;

border-radius:15px;

object-fit:cover;

}

.ver-align{

display:flex;

align-items:center;

}

#mapa{

height:350px;

width:100%;

border-radius:10px;

margin-top:20px;

}

@media(max-width:768px){

.ver-align{

display:block;

text-align:center;

}

}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5 mb-5">

<h2

id="titulo"

class="
text-primary
fw-bold
mb-4
text-center
d-flex
justify-content-center
align-items-center
gap-2
flex-wrap
"

></h2>

<div class="
row
g-4
ver-align
">

<!-- FOTO -->
<div class="
col-md-6
text-center
">

<img

id="foto"

class="foto-restaurante"

src="
https://via.placeholder.com/700x450?text=Restaurante
"

>

</div>

<!-- INFORMACION -->
<div class="
col-md-6
">

<div id="info"></div>

</div>

</div>

<!-- MAPA -->
<div id="mapa"></div>

<div class="
text-center
mt-4
">

<a

href="restaurantes.html"

class="
btn
btn-secondary
"

>

Volver al listado

</a>

</div>

<!-- RESEÑAS -->
<div class="
row
mt-5
">

<div class="
col-lg-8
mx-auto
">

<h4 class="
fw-bold
text-primary
mb-3
">

Calificaciones y comentarios

</h4>

<form

id="formularioResena"

class="
card
p-3
mb-4
shadow
"

>

<div class="mb-3">

<label class="form-label">
Tu nombre
</label>

<input

type="text"

id="nombre"

class="form-control"

placeholder="
Anónimo
"

>

</div>

<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="calificacion"

class="form-select"

required

>

<option value="">
Selecciona una opción
</option>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="comentario"

class="form-control"

rows="4"

required

></textarea>

</div>

<div class="text-end">

<button class="
btn
btn-primary
">

Enviar reseña

</button>

</div>

</form>

<div
id="resenas"
class="list-group"
></div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script src="
https://unpkg.com/leaflet/dist/leaflet.js
"></script>

<script>

/* URL */
const parametros =
new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');

let mapa;

/* DATOS */
async function cargarRestaurante(){

try{

const respuesta =
await fetch(

`http://localhost:3000/restaurante/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'titulo'
).innerHTML =
'Restaurante no encontrado';

return;

}

const r =
datos.restaurante;

/* TITULO */
document.getElementById(
'titulo'
).innerHTML =

`${r.nombre}`;

/* FOTO */
document.getElementById(
'foto'
).src =

r.imagen

?

'http://localhost:3000/' + r.imagen

:

'https://via.placeholder.com/700x450?text=Restaurante';

/* INFO */
document.getElementById(
'info'
).innerHTML = `

<p>

<strong>
Dirección:
</strong>

${r.direccion || 'No disponible'}

</p>

${
r.descripcion

?

`

<p>

<strong>
Descripción:
</strong>

<br>

${r.descripcion}

</p>

`

:

''
}

${
r.latitud && r.longitud

?

`

<p>

<strong>
Latitud:
</strong>

${r.latitud}

</p>

<p>

<strong>
Longitud:
</strong>

${r.longitud}

</p>

`

:

''
}

`;

/* MAPA */
if(
r.latitud &&
r.longitud
){

mapa = L.map('mapa').setView(

[
r.latitud,
r.longitud
],

15

);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'© OpenStreetMap'

}

).addTo(mapa);

L.marker(

[
r.latitud,
r.longitud
]

)

.addTo(mapa)

.bindPopup(
r.nombre
)

.openPopup();

}

}catch(error){

console.log(error);

}

}

cargarRestaurante();

/* RESEÑAS */
async function cargarResenas(){

try{

const respuesta =
await fetch(

`http://localhost:3000/resenas-restaurante/${id}`

);

const resenas =
await respuesta.json();

const contenedor =
document.getElementById(
'resenas'
);

/* LIMPIAR */
contenedor.innerHTML = '';

/* PROMEDIO */
let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});

if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

document.getElementById(
'titulo'
).innerHTML += `

<span class="
badge
bg-warning
text-dark
">

${promedio} ★
(${resenas.length})

</span>

`;

}

/* VACIO */
if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

/* MOSTRAR */
resenas.forEach(r=>{

contenedor.innerHTML += `

<div class="
list-group-item
shadow-sm
mb-3
rounded
">

<div class="
d-flex
justify-content-between
align-items-center
mb-2
">

<strong>

${r.nombre || 'Anónimo'}

</strong>

<span class="
badge
bg-warning
text-dark
">

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<small class="
text-muted
">

${r.creado_en || ''}

</small>

</div>

`;

});

}catch(error){

console.log(error);

}

}

cargarResenas();

/* ENVIAR */
document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const respuesta =
await fetch(

'http://localhost:3000/crear-resena-restaurante',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

item_id:id,

nombre:
document.getElementById(
'nombre'
).value,

calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

e.target.reset();

cargarResenas();

}

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
