<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ver Evento
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

.foto-evento{

width:100%;

max-width:700px;

height:auto;

border-radius:15px;

object-fit:cover;

}

.ver-align{

display:flex;

align-items:center;

}

#mapa{

height:350px;

width:100%;

border-radius:10px;

margin-top:20px;

}

@media(max-width:768px){

.ver-align{

display:block;

text-align:center;

}

}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5 mb-5">

<h2

id="titulo"

class="
text-primary
fw-bold
mb-4
text-center
d-flex
justify-content-center
align-items-center
gap-2
flex-wrap
"

></h2>

<div class="
row
g-4
ver-align
">

<!-- FOTO -->
<div class="
col-md-6
text-center
">

<img

id="foto"

class="foto-evento"

src="
https://via.placeholder.com/700x450?text=Evento
"

>

</div>

<!-- INFORMACION -->
<div class="
col-md-6
">

<div id="info"></div>

</div>

</div>

<!-- MAPA -->
<div id="mapa"></div>

<div class="
text-center
mt-4
">

<a

href="eventos.html"

class="
btn
btn-secondary
"

>

Volver al listado

</a>

</div>

<!-- RESEÑAS -->
<div class="
row
mt-5
">

<div class="
col-lg-8
mx-auto
">

<h4 class="
fw-bold
text-primary
mb-3
">

Calificaciones y comentarios

</h4>

<div
id="mensajeLogin"
class="
alert
alert-warning
d-none
mb-3
"
>

Debes iniciar sesión para escribir una reseña.

</div>

<div
id="mensajeLogin"
class="
alert
alert-warning
d-none
mb-3
"
>

Debes iniciar sesión para escribir una reseña.

</div>

<form

id="formularioResena"

class="
card
p-3
mb-4
shadow
"

>



<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="calificacion"

class="form-select"

required

>

<option value="">
Selecciona una opción
</option>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="comentario"

class="form-control"

rows="4"

required

></textarea>

</div>

<div class="text-end">

<button class="
btn
btn-primary
">

Enviar reseña

</button>

</div>

</form>

<div
id="resenas"
class="list-group"
></div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script src="
https://unpkg.com/leaflet/dist/leaflet.js
"></script>

<script>

/* URL */
const parametros =
new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');

/* SESION */
async function verificarSesion(){

const respuesta =
await fetch(

'http://localhost:3000/sesion'

);

const datos =
await respuesta.json();

/* NO LOGIN */
if(!datos.logueado){

document.getElementById(
'formularioResena'
).style.display =
'none';

document.getElementById(
'mensajeLogin'
).classList.remove(
'd-none'
);

}

}

verificarSesion();

let mapa;

/* DATOS */
async function cargarEvento(){

try{

const respuesta =
await fetch(

`http://localhost:3000/evento/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'titulo'
).innerHTML =
'Evento no encontrado';

return;

}

const e =
datos.evento;

window.nombreEvento =
e.titulo;

/* TITULO */
document.getElementById(
'titulo'
).innerHTML =

`${e.titulo}`;

/* FOTO */
document.getElementById(
'foto'
).src =

e.imagen

?

e.imagen

:

'https://via.placeholder.com/700x450?text=Evento';

/* INFO */
document.getElementById(
'info'
).innerHTML = `

<p>

<strong>
Fecha:
</strong>

${new Date(e.fecha).toLocaleDateString('es-CO')}

</p>

<p>

<strong>
Hora:
</strong>

${e.hora || 'No disponible'}

</p>

<p>

<strong>
Lugar:
</strong>

${e.lugar || 'No disponible'}

</p>

${
e.descripcion

?

`

<p>

<strong>
Descripción:
</strong>

<br>

${e.descripcion}

</p>

`

:

''
}

`;

/* MAPA */
if(
e.latitud &&
e.longitud
){

mapa = L.map('mapa').setView(

[
e.latitud,
e.longitud
],

15

);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'© OpenStreetMap'

}

).addTo(mapa);

L.marker(

[
e.latitud,
e.longitud
]

)

.addTo(mapa)

.bindPopup(
e.titulo
)

.openPopup();

}else{

document.getElementById(
'mapa'
).style.display =
'none';

}

}catch(error){

console.log(error);

}

}

cargarEvento();

/* RESEÑAS */
async function cargarResenas(){

try{

const respuesta =
await fetch(

'http://localhost:3000/resenas-evento/' + id

);

const resenas =
await respuesta.json();

const contenedor =
document.getElementById(
'resenas'
);

/* LIMPIAR */
contenedor.innerHTML = '';

/* PROMEDIO */
let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});

if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

document.getElementById(
'titulo'
).innerHTML = `

${window.nombreEvento}

<span class="
badge
bg-warning
text-dark
">

${promedio} ★
(${resenas.length})

</span>

`;

}

/* VACIO */
if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

/* MOSTRAR */
let html = '';

resenas.forEach(r=>{

html += `

<div class="
list-group-item
shadow-sm
mb-3
rounded
">

<div class="
d-flex
justify-content-between
align-items-center
mb-2
">

<strong>

${r.nombre || 'Anónimo'}

</strong>

<span class="
badge
bg-warning
text-dark
">

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<small class="
text-muted
">

${new Date(
r.creado_en
).toLocaleString()}

</small>

</div>

`;

});

contenedor.innerHTML = html;

}catch(error){

console.log(error);

}

}

cargarResenas();

/* ENVIAR */
document.getElementById(
'formularioResena'
).onsubmit = null;

document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const respuesta =
await fetch(

'http://localhost:3000/crear-resena-evento',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

item_id:id,



calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

e.target.reset();

cargarResenas();

}

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
