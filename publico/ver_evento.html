<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ver Evento
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

.foto-evento{

width:100%;

max-width:700px;

height:auto;

border-radius:15px;

object-fit:cover;

}

.ver-align{

display:flex;

align-items:center;

}

#mapa{

height:350px;

width:100%;

border-radius:10px;

margin-top:20px;

}

@media(max-width:768px){

.ver-align{

display:block;

text-align:center;

}

}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5 mb-5">

<h2

id="titulo"

class="
text-primary
fw-bold
mb-4
text-center
d-flex
justify-content-center
align-items-center
gap-2
flex-wrap
"

></h2>

<div class="
row
g-4
ver-align
">

<!-- FOTO -->
<div class="
col-md-6
text-center
">

<img

id="foto"

class="foto-evento"

src="
https://via.placeholder.com/700x450?text=Evento
"

>

</div>

<!-- INFORMACION -->
<div class="
col-md-6
">

<div id="info"></div>

</div>

</div>

<!-- MAPA -->
<div id="mapa"></div>

<div class="
text-center
mt-4
">

<a

href="eventos.html"

class="
btn
btn-secondary
"

>

Volver al listado

</a>

</div>

<!-- RESEÑAS -->
<div class="
row
mt-5
">

<div class="
col-lg-8
mx-auto
">

<h4 class="
fw-bold
text-primary
mb-3
">

Calificaciones y comentarios

</h4>

<div
class="
alert
alert-warning
d-none
mb-3
"
>



</div>

<div
id="mensajeLogin"
class="
alert
alert-warning
d-none
mb-3
"
>

Debes iniciar sesión para escribir una reseña.

</div>

<form

id="formularioResena"

class="
card
p-3
mb-4
shadow
"

>



<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="calificacion"

class="form-select"

required

>

<option value="">
Selecciona una opción
</option>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="comentario"

class="form-control"

rows="4"

required

></textarea>

</div>

<div class="text-end">

<button class="
btn
btn-primary
">

Enviar reseña

</button>

</div>

</form>

<div class="
row
g-4
align-items-start
">

<!-- RESUMEN -->
<div class="
col-lg-4
">

<div
id="calificacionBox"
></div>

</div>

<!-- COMENTARIOS -->
<div class="
col-lg-8
">

<div
id="resenas"
class="list-group"
></div>

</div>

</div>

</div>

</div>

</div>

<!-- =====================================
     MODAL EDITAR RESEÑA
===================================== -->

<div
class="
modal
fade
"
id="modalEditarResena"
tabindex="-1"
>

<div class="
modal-dialog
modal-dialog-centered
">

<div class="
modal-content
border-0
shadow
rounded-4
">

<div class="
modal-header
border-0
">

<h5 class="
modal-title
fw-bold
text-primary
">

Editar reseña

</h5>

<button

type="button"

class="btn-close"

data-bs-dismiss="modal"

></button>

</div>

<div class="
modal-body
">

<input
type="hidden"
id="editarResenaId"
>

<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="editarCalificacion"

class="form-select"

>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="editarComentario"

class="form-control"

rows="4"

></textarea>

</div>

</div>

<div class="
modal-footer
border-0
">

<button

class="
btn
btn-secondary
"

data-bs-dismiss="modal"

>

Cancelar

</button>

<button

class="
btn
btn-primary
"

onclick="
guardarEditarResena()
"

>

Guardar cambios

</button>

</div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script src="
https://unpkg.com/leaflet/dist/leaflet.js
"></script>

<script>

/* URL */
const parametros =
new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');
let usuarioActual = null;

/* SESION */
async function verificarSesion(){

const respuesta =
await fetch(

'http://localhost:3000/sesion'

);

const datos =
await respuesta.json();

/* USUARIO */
if(datos.logueado){

usuarioActual =
datos.usuario;

}

/* NO LOGIN */
if(!datos.logueado){

document.getElementById(
'formularioResena'
).style.display =
'none';

document.getElementById(
'mensajeLogin'
).classList.remove(
'd-none'
);

}

}

verificarSesion();

let mapa;

/* DATOS */
async function cargarEvento(){

try{

const respuesta =
await fetch(

`http://localhost:3000/evento/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'titulo'
).innerHTML =
'Evento no encontrado';

return;

}

const e =
datos.evento;

window.nombreEvento =
e.titulo;

/* TITULO */
document.getElementById(
'titulo'
).innerHTML =

`${e.titulo}`;

/* FOTO */
document.getElementById(
'foto'
).src =

e.imagen

?

e.imagen

:

'https://via.placeholder.com/700x450?text=Evento';

/* INFO */
document.getElementById(
'info'
).innerHTML = `

${
e.descripcion

?

`

<p>

<strong>
Descripción:
</strong>

<br>

${e.descripcion}

</p>

`

:

''
}

<p>

<strong>
Fecha:
</strong>

${new Date(e.fecha).toLocaleDateString('es-CO')}

</p>

<p>

<strong>
Hora:
</strong>

${e.hora || 'No disponible'}

</p>

<p>

<strong>
Lugar:
</strong>

${e.lugar || 'No disponible'}

</p>

`;

/* MAPA */
if(
e.latitud &&
e.longitud
){

mapa = L.map('mapa').setView(

[
e.latitud,
e.longitud
],

15

);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'© OpenStreetMap'

}

).addTo(mapa);

L.marker(

[
e.latitud,
e.longitud
]

)

.addTo(mapa)

.bindPopup(
e.titulo
)

.openPopup();

}else{

document.getElementById(
'mapa'
).style.display =
'none';

}

}catch(error){

console.log(error);

}

}

cargarEvento();

/* RESEÑAS */
async function cargarResenas(){

try{

const respuesta =
await fetch(

'http://localhost:3000/resenas-evento/' + id

);

const resenas =
await respuesta.json();
window.listaResenas =
resenas;

const contenedor =
document.getElementById(
'resenas'
);

/* LIMPIAR */
contenedor.innerHTML = '';

/* PROMEDIO */
let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});

if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

document.getElementById(
'titulo'
).innerHTML =

window.nombreEvento;

}

/* CONTADORES */
let cinco = 0;
let cuatro = 0;
let tres = 0;
let dos = 0;
let uno = 0;

/* CONTAR */
resenas.forEach(r=>{

if(r.calificacion == 5) cinco++;
if(r.calificacion == 4) cuatro++;
if(r.calificacion == 3) tres++;
if(r.calificacion == 2) dos++;
if(r.calificacion == 1) uno++;

});

/* PORCENTAJE */
function porcentaje(valor){

return (
valor / resenas.length
) * 100;

}

/* ESTRELLAS */
function estrellasAzules(){

let html = '';

for(let i=1; i<=5; i++){

html += `
<i
class="fa-solid fa-star"
style="
color:#3483FA;
font-size:20px;
"
></i>
`;

}

return html;

}

/* CAJA */
document.getElementById(
'calificacionBox'
).innerHTML = `

<div
class="mx-auto text-start"
style="
max-width:420px;
"
>

<h4 class="
fw-bold
mb-4
">

Reseñas del evento

</h4>

<div class="
d-flex
align-items-center
gap-3
mb-4
">

<div style="
font-size:60px;
font-weight:300;
color:#3483FA;
line-height:1;
">

${promedio}

</div>

<div>

<div class="mb-1">

${estrellasAzules()}

</div>

<div style="
color:#777;
font-size:14px;
">

${resenas.length}
calificaciones

</div>

</div>

</div>

${crearBarra(5, cinco)}
${crearBarra(4, cuatro)}
${crearBarra(3, tres)}
${crearBarra(2, dos)}
${crearBarra(1, uno)}

</div>

`;

/* BARRAS */
function crearBarra(
numero,
cantidad
){

return `

<div class="
d-flex
align-items-center
gap-2
mb-2
">

<div style="
width:15px;
font-size:14px;
color:#555;
">

${numero}

</div>

<div style="
flex:1;
height:8px;
background:#E5E5E5;
border-radius:20px;
overflow:hidden;
">

<div style="
width:${porcentaje(cantidad)}%;
height:100%;
background:#3483FA;
border-radius:20px;
">

</div>

</div>

<div style="
color:#999;
font-size:14px;
">

★

</div>

</div>

`;

}

/* VACIO */
if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

/* MOSTRAR */
let html = '';

resenas.forEach(r=>{

html += `

<div class="
list-group-item
shadow-sm
mb-3
rounded
">

<div class="
d-flex
justify-content-between
align-items-center
mb-2
">

<strong>

${r.nombre || 'Anónimo'}

</strong>

<span

style="
color:#3483FA;
font-weight:700;
font-size:15px;
"
>

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<div class="
d-flex
justify-content-between
align-items-center
mt-2
">

<small class="
text-muted
">

${new Date(
r.creado_en
).toLocaleString()}

</small>

${
usuarioActual
&&
Number(usuarioActual.id)
===
Number(r.usuario_id)

?

`

<div class="dropdown">

<button

class="
btn
btn-sm
border-0
shadow-none
text-muted
"

data-bs-toggle="dropdown"

>

<i class="
fa-solid
fa-ellipsis-vertical
"></i>

</button>

<ul class="
dropdown-menu
dropdown-menu-end
shadow
border-0
">

<li>

<a

class="
dropdown-item
"

href="javascript:void(0)"

onclick="
abrirEditarResena(${r.id})
"

>

Editar

</a>

</li>

<li>

<a

class="
dropdown-item
text-danger
"

href="javascript:void(0)"

onclick="
eliminarResena(${r.id})
"

>

Eliminar

</a>

</li>

</ul>

</div>

`

:

''
}

</div>
</div>

`;

});

contenedor.innerHTML = html;

}catch(error){

console.log(error);

}

}

cargarResenas();

/* ENVIAR */
document.getElementById(
'formularioResena'
).onsubmit = null;

document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const respuesta =
await fetch(

'http://localhost:3000/crear-resena-evento',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

item_id:id,



calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

e.target.reset();

cargarResenas();

}

}

);

/* =====================================
   ELIMINAR RESEÑA
===================================== */

async function eliminarResena(id){

try{

const respuesta =
await fetch(

'http://localhost:3000/eliminar-resena',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({
id:id,
tipo:'evento'
})

}

);

const resultado =
await respuesta.json();

console.log(resultado);

/* OK */
if(resultado.ok){

cargarResenas();

}

/* ERROR */
else{

alert(
'No se pudo eliminar'
);

}

}catch(error){

console.log(error);

}

}

/* =====================================
   ABRIR EDITAR
===================================== */

function abrirEditarResena(
id
){

const resena =
window.listaResenas.find(
r=>r.id == id
);

if(!resena){
return;
}

/* ID */
document.getElementById(
'editarResenaId'
).value =
resena.id;

/* CALIFICACION */
document.getElementById(
'editarCalificacion'
).value =
resena.calificacion;

/* COMENTARIO */
document.getElementById(
'editarComentario'
).value =
resena.comentario;

/* MODAL */
const modal =
new bootstrap.Modal(

document.getElementById(
'modalEditarResena'
)

);

modal.show();

}

/* =====================================
   GUARDAR EDICION
===================================== */

async function guardarEditarResena(){

try{

const respuesta =
await fetch(

'http://localhost:3000/editar-resena',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

id:
document.getElementById(
'editarResenaId'
).value,

tipo:'evento',

calificacion:
document.getElementById(
'editarCalificacion'
).value,

comentario:
document.getElementById(
'editarComentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

/* CERRAR */
bootstrap.Modal
.getInstance(

document.getElementById(
'modalEditarResena'
)

).hide();

/* RECARGAR */
cargarResenas();

}

}catch(error){

console.log(error);

}

}

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
