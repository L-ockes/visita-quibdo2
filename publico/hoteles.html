<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Hoteles - Visita Quibdó
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body class="
d-flex
flex-column
min-vh-100
">

<div id="navbar"></div>

<div class="
container
mt-5
flex-grow-1
">

<h2 class="
text-primary
fw-bold
mb-4
text-center
">

Hoteles en Quibdó

</h2>

<form

id="formularioBusqueda"

class="
row
g-3
mb-4
"

>

<div class="col-md-10">

<input

type="search"

id="busqueda"

class="form-control"

placeholder="
Buscar hotel
"

>

</div>

<div class="col-md-2 d-grid">

<button

type="submit"

class="
btn
btn-primary
"

>

Buscar

</button>

</div>

</form>

<div
class="row"
id="contenedor"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>

<script src="footer.js"></script>

<script>

async function cargarHoteles(
termino = ''
){

const respuesta =

await fetch(

`http://localhost:3000/hoteles?q=${termino}`

);

const hoteles =
await respuesta.json();

let html = '';

/* VACIO */
if(hoteles.length === 0){

html = `

<p class="
text-center
text-muted
">

No hay hoteles.

</p>

`;

}

/* MOSTRAR */
hoteles.forEach(hotel => {

html += `

<div class="
col-md-4
mb-4
">

<div class="
card
shadow
h-100
">

<img

src="
${
hotel.imagen

?

'http://localhost:3000/' + hotel.imagen

:

'https://via.placeholder.com/400x220?text=Sin+Imagen'
}
"

class="
card-img-top
"

style="
height:220px;
object-fit:cover;
"

>

<div class="
card-body
d-flex
flex-column
">

<h5 class="
card-title
text-primary
fw-bold
d-flex
align-items-center
gap-2
flex-wrap
">

${hotel.nombre}

${
hotel.total_resenas > 0

?

`

<span class="
badge
bg-warning
text-dark
">

${hotel.promedio_resenas} ★
(${hotel.total_resenas})

</span>

`

:

''

}

</h5>

<p class="card-text">

${
hotel.descripcion
?.substring(0,100)
|| ''
}...

</p>

<p class="
text-muted
small
">

📍 ${hotel.direccion || ''}

</p>

<a

href="
ver_hotel.html?id=${hotel.id}
"

class="
btn
btn-outline-primary
w-100
mt-auto
"

>

Ver más

</a>

</div>

</div>

</div>

`;

});

document.getElementById(
'contenedor'
).innerHTML = html;

}

/* CARGAR */
cargarHoteles();

/* BUSQUEDA */
document.getElementById(
'formularioBusqueda'
)

.addEventListener(

'submit',

(e)=>{

e.preventDefault();

const termino =

document.getElementById(
'busqueda'
).value;

cargarHoteles(
termino
);

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>

</html>
