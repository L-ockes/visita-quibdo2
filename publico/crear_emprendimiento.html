<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Registrar Emprendimiento
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5">

<h2 class="
text-primary
fw-bold
mb-4
text-center
">

Registrar mi Emprendimiento

</h2>

<form

id="formulario"

enctype="multipart/form-data"

class="
p-4
shadow
rounded
bg-white
"

>

<div class="mb-3">

<label>
Nombre
</label>

<input

type="text"

name="nombre_emprendimiento"

class="form-control"

required
>

</div>

<div class="mb-3">

<label>
Categoría
</label>

<select

name="categoria"

id="categoriaSelect"

class="form-control"

required

></select>

<input

type="text"

name="categoria_nueva"

id="categoriaNueva"

class="
form-control
mt-2
"

placeholder="
Nueva categoría
"

style="
display:none;
"

>

</div>

<div class="mb-3">

<label>
Descripción
</label>

<textarea

name="descripcion"

class="form-control"

required

></textarea>

</div>

<div class="mb-3">

<label>
Ubicación
</label>

<input

type="text"

name="ubicacion"

class="form-control"

required
>

</div>

<div class="mb-3">

<label>
Horarios
</label>

<input

type="text"

name="horarios"

class="form-control"
>

</div>

<div class="mb-3">

<label>
Servicios
</label>

<select

name="servicios"

id="serviciosSelect"

class="form-control"

required

></select>

<input

type="text"

name="servicio_nuevo"

id="servicioNuevo"

class="
form-control
mt-2
"

placeholder="
Nuevo servicio
"

style="
display:none;
"

>

</div>

<div class="mb-3">

<label>
Servicios extra
</label>

<textarea

name="servicios_extra"

class="form-control"

></textarea>

</div>

<div class="mb-3">

<label>
Foto
</label>

<input

type="file"

name="foto"

class="form-control"

>

</div>

<button class="
btn
btn-primary
w-100
">

Guardar

</button>

<div
id="mensaje"
class="mt-3"
></div>

</form>

</div>

<script src="navbar.js"></script>

<script>

/* CATEGORIAS */
async function cargarCategorias(){

const respuesta =
await fetch(
'http://localhost:3000/categorias'
);

const categorias =
await respuesta.json();

const select =
document.getElementById(
'categoriaSelect'
);

categorias.forEach(cat=>{

select.innerHTML += `

<option>

${cat.nombre_categoria}

</option>

`;

});

select.innerHTML += `
<option>
Otro
</option>
`;

}

/* SERVICIOS */
async function cargarServicios(){

const respuesta =
await fetch(
'http://localhost:3000/servicios'
);

const servicios =
await respuesta.json();

const select =
document.getElementById(
'serviciosSelect'
);

servicios.forEach(servicio=>{

select.innerHTML += `

<option>

${servicio.nombre_servicio}

</option>

`;

});

select.innerHTML += `
<option>
Otro
</option>
`;

}

cargarCategorias();
cargarServicios();

/* OTRO */
document.getElementById(
'categoriaSelect'
)

.addEventListener(
'change',
()=>{

document.getElementById(
'categoriaNueva'
).style.display =

document.getElementById(
'categoriaSelect'
).value === 'Otro'

?

'block'

:

'none';

}
);

document.getElementById(
'serviciosSelect'
)

.addEventListener(
'change',
()=>{

document.getElementById(
'servicioNuevo'
).style.display =

document.getElementById(
'serviciosSelect'
).value === 'Otro'

?

'block'

:

'none';

}
);

/* FORM */
document.getElementById(
'formulario'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const datos =
new FormData(
e.target
);

const respuesta =
await fetch(

'http://localhost:3000/crear-emprendimiento',

{

method:'POST',

body:datos

}

);

const resultado =
await respuesta.json();

document.getElementById(
'mensaje'
).innerHTML =

resultado.ok

?

`

<div class="
alert
alert-success
">

${resultado.mensaje}

</div>

`

:

`

<div class="
alert
alert-danger
">

${resultado.mensaje}

</div>

`;

}

);


</script>
<script src="navbar.js"></script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>


</div>

<div id="footer"></div>

<script src="footer.js"></script>
</body>
</html>
