<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pago Premium | Visita Quibdó</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
    background:#f5f7fa;
    font-family:Arial, Helvetica, sans-serif;
}

.card-pago{

    max-width:700px;

    margin:auto;

    margin-top:50px;

    background:white;

    border-radius:20px;

    padding:40px;

    box-shadow:0 0 25px rgba(0,0,0,.1);

}

.precio{

    font-size:60px;

    font-weight:bold;

    color:#0A66C2;

}

.lista-beneficios{

    list-style:none;

    padding:0;

}

.lista-beneficios li{

    margin-bottom:15px;

    font-size:18px;

}

.lista-beneficios i{

    color:#0A66C2;

    margin-right:10px;

}

.btn-premium{

    background:#0A66C2;

    color:white;

    font-size:20px;

    padding:15px;

    border:none;

    border-radius:12px;

    width:100%;

}

.btn-premium:hover{

    background:#084B91;

}

</style>

</head>

<body class="d-flex flex-column min-vh-100">

<div id="navbar"></div>

<div class="container flex-grow-1">

    <div class="card-pago">

        <div class="text-center">

            <h1 class="mb-4">
                Plan Premium
            </h1>

            <div class="precio">
                $25.000
            </div>

            <p class="text-muted">
                Pago mensual
            </p>

        </div>

        <hr>

        <h4 class="mb-4">
            Beneficios incluidos
        </h4>

        <ul class="lista-beneficios">

            <li>
                <i class="fa-solid fa-circle-check"></i>
                Emprendimiento destacado
            </li>

            <li>
                <i class="fa-solid fa-circle-check"></i>
                Mayor visibilidad
            </li>

            <li>
                <i class="fa-solid fa-circle-check"></i>
                Más fotografías
            </li>

            <li>
                <i class="fa-solid fa-circle-check"></i>
                Insignia Premium
            </li>

            <li>
                <i class="fa-solid fa-circle-check"></i>
                Prioridad en búsquedas
            </li>

        </ul>

        <button
        class="btn-premium"
        onclick="procederPago()">

            Proceder al Pago

        </button>

    </div>

</div>

<div id="footer"></div>

<script>

async function procederPago(){

try{

const plan =
localStorage.getItem(
'planSeleccionado'
);

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/crear-orden-paypal',

{
method:'POST',
credentials:'include',
headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
plan
})

}

);

const data =
await respuesta.json();

if(!data.ok){

alert('Error creando orden');

return;

}

const enlacePago =
data.links.find(

link =>
link.rel === 'approve'

);

if(enlacePago){

window.location.href =
enlacePago.href;

}

}
catch(error){

console.log(error);

alert('Error del servidor');

}

}

</script>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
