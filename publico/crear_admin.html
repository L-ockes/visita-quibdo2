<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Crear Administrador
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

</head>

<body class="
bg-light
d-flex
flex-column
min-vh-100
">

<div id="navbar"></div>

<div class="
container
mt-5
flex-grow-1
" style="
max-width:500px;
">

<h3 class="
text-center
text-primary
fw-bold
mb-4
">

Crear Administrador

</h3>

<form

id="formulario"

class="
p-4
bg-white
shadow
rounded
"

>

<div class="mb-3">

<label class="form-label">
Nombre del Administrador
</label>

<input

type="text"

name="nombre"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">
Correo del Administrador
</label>

<input

type="email"

name="correo"

class="form-control"

required

autocomplete="off"

>

</div>

<div class="mb-3">

<label class="form-label">
Contraseña
</label>

<input

type="password"

name="contrasena"

class="form-control"

required

autocomplete="new-password"

>

</div>

<button class="
btn
btn-primary
w-100
">

Crear Administrador

</button>

<div
id="mensaje"
class="mt-3"
></div>

</form>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

document.getElementById(
'formulario'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const datos = {

nombre:
e.target.nombre.value,

correo:
e.target.correo.value,

contrasena:
e.target.contrasena.value

};

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/crear-admin',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify(
datos
)

}

);

const resultado =
await respuesta.json();

document.getElementById(
'mensaje'
).innerHTML =

resultado.ok

?

`

<div class="
alert
alert-success
">

${resultado.mensaje}

</div>

`

:

`

<div class="
alert
alert-danger
">

${resultado.mensaje}

</div>

`;

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>

</html>
