<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Lugares Turísticos
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5 mb-5">

<h2 class="
text-primary
fw-bold
mb-4
text-center
">

Lugares Turísticos

</h2>

<div class="
row
g-3
mb-4
">

<div class="col-md-10">

<input

type="search"

id="busqueda"

class="form-control"

placeholder="
Buscar por nombre, descripción o dirección
"

>

</div>

<div class="
col-md-2
d-grid
">

<button

onclick="cargarLugares()"

class="
btn
btn-primary
"

>

Buscar

</button>

</div>

</div>

<div
id="contenedor"
class="row"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* LUGARES */
async function cargarLugares(){

const busqueda =
document.getElementById(
'busqueda'
).value;

const respuesta =
await fetch(

`http://localhost:3000/lugares?q=${busqueda}`

);

const lugares =
await respuesta.json();

const contenedor =
document.getElementById(
'contenedor'
);

/* VACIO */
if(lugares.length === 0){

contenedor.innerHTML = `

<p class="
text-center
text-muted
">

No hay lugares registrados

</p>

`;

return;

}

/* LIMPIAR */
contenedor.innerHTML = '';

/* MOSTRAR */
lugares.forEach(l=>{

contenedor.innerHTML += `

<div class="
col-md-4
mb-4
">

<div class="
card
shadow
h-100
">

<img

src="
${

l.imagen

?

l.imagen

:

'https://via.placeholder.com/400x220?text=Sin+Imagen'

}
"

class="card-img-top"

style="
height:220px;
object-fit:cover;
"

>

<div class="card-body">

<h5 class="
card-title
text-primary
fw-bold
d-flex
align-items-center
gap-2
flex-wrap
">

${l.nombre}

${
l.total_resenas > 0

?

`

<span class="
badge
bg-warning
text-dark
">

${l.promedio_resenas} ★
(${l.total_resenas})

</span>

`

:

''
}

</h5>

<p class="card-text">

${

l.descripcion

?

l.descripcion.substring(0,80)

:

''

}...

</p>

<p class="
text-muted
small
">

📍
${l.direccion || 'Dirección no disponible'}

</p>

<a

href="
ver_lugar.html?id=${l.id}
"

class="
btn
btn-outline-primary
w-100
"

>

Ver más

</a>

</div>

</div>

</div>

`;

});

}

cargarLugares();

/* ENTER */
document.getElementById(
'busqueda'
)

.addEventListener(

'keypress',

function(e){

if(e.key === 'Enter'){

cargarLugares();

}

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
