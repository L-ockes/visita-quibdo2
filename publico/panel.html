<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Mi Emprendimiento
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

.foto-panel{

width:100%;

height:300px;

object-fit:cover;

border-radius:10px;

}

</style>

</head>

<body class="
d-flex
flex-column
min-vh-100
">

<div id="navbar"></div>

<div class="
container
mt-5
mb-5
flex-grow-1
">

<div
id="contenido"
class="row g-4"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

async function cargarPanel(){

const contenedor =
document.getElementById(
'contenido'
);

try{

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/panel-datos'

);

const datos =
await respuesta.json();

/* ERROR LOGIN */
if(!datos.ok){

contenedor.innerHTML = `

<div class="
col-12
">

<div class="
alert
alert-danger
text-center
">

Debes iniciar sesión

</div>

</div>

`;

return;

}

/* SIN EMPRENDIMIENTO */
if(!datos.tieneDatos){

contenedor.innerHTML = `

<div class="
col-12
">

<div class="
card
shadow-lg
border-0
rounded-4
overflow-hidden
">

<div class="
card-body
p-5
text-center
">

<div class="
mb-4
">

<i class="
fa-solid
fa-store
text-primary
"

style="
font-size:80px;
"></i>

</div>

<h1 class="
fw-bold
text-primary
mb-3
">

Mi Emprendimiento

</h1>

<p class="
text-muted
fs-5
mb-4
">

Aún no has registrado un emprendimiento.

Comienza ahora y muestra tu negocio,
productos o servicios dentro de
Visita Quibdó.

</p>

<div class="
d-flex
justify-content-center
">

<a

href="
planes.html
"

class="
btn
btn-primary
btn-lg
px-5
py-3
rounded-pill
shadow
"

>

<i class="
fa-solid
fa-plus
me-2
"></i>

Registrar emprendimiento

</a>

</div>

</div>

</div>

</div>

`;

return;

}

/* EMPRENDIMIENTOS */
const emprendimientos =
datos.emprendimientos;

const plan =
datos.plan || 'gratis';

const estadoPago =
datos.estado_pago || 'activo';

const fechaVencimiento =
datos.fecha_vencimiento || '';

let fechaVencimientoFormateada = '';

if(fechaVencimiento){

const fecha =
new Date(fechaVencimiento);

fechaVencimientoFormateada =
fecha.toLocaleString(

'es-CO',

{

year:'numeric',
month:'long',
day:'numeric',
hour:'numeric',
minute:'2-digit',
hour12:true

}

);

}

/* HTML */
let html = `

<div class="
alert
${plan === 'premium'
? 'alert-primary'
: 'alert-secondary'}
mb-4
">

<h5 class="mb-2">

${plan === 'premium'

? '⭐ Plan Premium'

: 'Plan Gratuito'}

</h5>

<p class="mb-1">

Estado:
<strong>${estadoPago}</strong>

</p>

${
fechaVencimiento

?

`<p class="mb-0">

Vence:

<strong>${fechaVencimientoFormateada}</strong>

</p>`

:

''

}

</div>

<div class="
d-flex
justify-content-between
align-items-center
mb-4
">

<h1 class="
fw-bold
text-primary
">

Mis Emprendimientos

</h1>

<a

href="
crear_emprendimiento.html
"

class="
btn
btn-primary
rounded-pill
px-4
py-2
"

>

<i class="
fa-solid
fa-plus
me-2
"></i>

Nuevo

</a>

</div>

`;

/* RECORRER */
emprendimientos.forEach(e=>{

html += `

<div class="
col-md-6
col-lg-4
">

<div class="
card
shadow-lg
border-0
rounded-4
overflow-hidden
h-100
">

<img

src="
${
e.foto

?

'https://visita-quibdo2.onrender.com/fotos/' +

e.foto.replace(
'fotos/',
''
)

:

'https://via.placeholder.com/500x300?text=Emprendimiento'
}
"

class="
foto-panel
"

>

<div class="
card-body
d-flex
flex-column
">

<h4 class="
fw-bold
text-primary
mb-3
">

${e.nombre_emprendimiento || ''}

</h4>

<p class="
text-muted
mb-2
">

${e.categoria || ''}

</p>

<p class="
small
text-muted
mb-4
">

${e.ubicacion || ''}

</p>

<div class="
mt-auto
d-flex
gap-2
flex-wrap
">

<a

href="
ver_mas.html?id=${e.id}
"

class="
btn
btn-outline-primary
rounded-pill
flex-fill
"

>

Ver

</a>

<a

href="
editar_emprendimiento.html?id=${e.id}
"

class="
btn
btn-primary
rounded-pill
flex-fill
"

>

Editar

</a>

<button

class="
btn
btn-danger
rounded-pill
flex-fill
"

onclick="
eliminarEmprendimiento(${e.id})
"

>

Eliminar

</button>

</div>

</div>

</div>

</div>

</div>

`;

});

/* CERRAR */
html += `

`;

contenedor.innerHTML =
html;

}catch(error){

console.log(error);

contenedor.innerHTML = `

<div class="
col-12
">

<div class="
alert
alert-danger
text-center
">

Ocurrió un error al cargar el panel

</div>

</div>

`;

}

}

cargarPanel();

/* =====================================
   ELIMINAR
===================================== */

async function eliminarEmprendimiento(id){

const confirmar =
confirm(

'¿Eliminar este emprendimiento?'

);

if(!confirmar){

return;

}

try{

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/eliminar-emprendimiento/' + id,

{

method:'DELETE'

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

alert(
'Emprendimiento eliminado'
);

cargarPanel();

}else{

alert(
resultado.mensaje
);

}

}catch(error){

console.log(error);

alert(
'Error servidor'
);

}

}

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>

</html>
