<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Registro
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body class="
d-flex
flex-column
min-vh-100
">

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- CONTENIDO -->
<div class="
container
mt-5
flex-grow-1
">

<h2 class="
text-center
text-primary
fw-bold
">

Crear Cuenta

</h2>

<form

id="formularioRegistro"

class="
p-4
bg-white
shadow
rounded
mt-4
"

style="
max-width:500px;
margin:auto;
"

enctype="
multipart/form-data
"

>

<div class="mb-3">

<label class="form-label">

Nombre completo

</label>

<input

type="text"

id="nombre"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">

Correo electrónico

</label>

<input

type="email"

id="correo"

name="email"

autocomplete="email"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">

Teléfono

</label>

<input

type="text"

id="telefono"

name="telefono"

autocomplete="tel"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">

Foto de perfil

</label>

<input

type="file"

id="foto"

class="form-control"

accept="image/*"

>

</div>

<div class="mb-3">

<label class="form-label">

Contraseña

</label>

<input

type="password"

id="contrasena"

name="password"

autocomplete="new-password"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">

Confirmar contraseña

</label>

<input

type="password"

id="contrasena2"

class="form-control"

required

>

</div>

<button class="
btn
btn-primary
w-100
">

Registrarse

</button>

<p class="
text-center
mt-3
">

¿Ya tienes cuenta?

<a href="login.html">

Inicia sesión aquí

</a>

</p>

<div

id="mensaje"

class="
text-center
mt-3
"

></div>

</form>

</div>
<br>
<br>
<br>
<!-- FOOTER -->
<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

document.getElementById(
'formularioRegistro'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

/* FORM DATA */
const formData =
new FormData();

formData.append(

'nombre',

document.getElementById(
'nombre'
).value

);

formData.append(

'correo',

document.getElementById(
'correo'
).value

);

formData.append(

'telefono',

document.getElementById(
'telefono'
).value

);

formData.append(

'contrasena',

document.getElementById(
'contrasena'
).value

);

formData.append(

'contrasena2',

document.getElementById(
'contrasena2'
).value

);

/* FOTO */
const foto =
document.getElementById(
'foto'
).files[0];

if(foto){

formData.append(
'foto',
foto
);

}

/* PETICION */
const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/registro',

{

method:'POST',

body:formData

}

);

const datos =
await respuesta.json();

const mensaje =
document.getElementById(
'mensaje'
);

/* EXITO */
if(datos.ok){

mensaje.innerHTML = `

<div class="
alert
alert-success
">

Cuenta creada correctamente

</div>

`;

setTimeout(()=>{

window.location.href =
'login.html';

},1500);

}

/* ERROR */
else{

mensaje.innerHTML = `

<div class="
alert
alert-danger
">

${datos.mensaje}

</div>

`;

}

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>

</html>
