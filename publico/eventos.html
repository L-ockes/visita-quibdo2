<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Eventos culturales
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body class="
d-flex
flex-column
min-vh-100
">

<div id="navbar"></div>

<div class="
container
mt-5
flex-grow-1
">

<h2 class="
text-primary
fw-bold
mb-4
text-center
">

Eventos culturales

</h2>

<div class="
row
g-3
mb-4
">

<!-- BUSQUEDA -->
<div class="col-md-6">

<label class="
form-label
fw-semibold
">

Buscar

</label>

<input

type="search"

id="busqueda"

class="form-control"

placeholder="
Título, descripción o lugar
"

>

</div>

<!-- DESDE -->
<div class="col-md-3">

<label class="
form-label
fw-semibold
">

Desde

</label>

<input

type="date"

id="desde"

class="form-control"

>

</div>

<!-- HASTA -->
<div class="col-md-3">

<label class="
form-label
fw-semibold
">

Hasta

</label>

<input

type="date"

id="hasta"

class="form-control"

>

</div>

<div class="
col-12
d-flex
justify-content-end
gap-2
">

<button

onclick="limpiarFiltros()"

class="
btn
btn-outline-secondary
"

>

Limpiar

</button>

<button

onclick="cargarEventos()"

class="
btn
btn-primary
"

>

Aplicar

</button>

</div>

</div>

<div
id="contenedor"
class="row"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* EVENTOS */
async function cargarEventos(){

const q =
document.getElementById(
'busqueda'
).value;

const desde =
document.getElementById(
'desde'
).value;

const hasta =
document.getElementById(
'hasta'
).value;

const respuesta =
await fetch(

`http://localhost:3000/eventos?q=${q}&desde=${desde}&hasta=${hasta}`

);

const eventos =
await respuesta.json();

const contenedor =
document.getElementById(
'contenedor'
);

/* VACIO */
if(eventos.length === 0){

contenedor.innerHTML = `

<p class="
text-center
text-muted
">

No hay eventos registrados

</p>

`;

return;

}

/* LIMPIAR */
contenedor.innerHTML = '';

/* MOSTRAR */
eventos.forEach(e=>{

contenedor.innerHTML += `

<div class="
col-md-4
mb-4
">

<div class="
card
shadow
h-100
">

<img

src="
${

e.imagen

?

e.imagen

:

'https://via.placeholder.com/400x220?text=Sin+Imagen'

}
"

class="card-img-top"

style="
height:220px;
object-fit:cover;
"

>

<div class="
card-body
d-flex
flex-column
">

<h5 class="
card-title
fw-bold
text-primary
d-flex
align-items-center
gap-2
flex-wrap
">

${e.titulo}

${
e.total_resenas > 0

?

`

<span style="
color:#3483FA;
font-size:15px;
font-weight:700;
">

★ ${e.promedio_resenas}

</span>

<span style="
color:#777;
font-size:14px;
font-weight:400;
">

(${e.total_resenas})

</span>

`

:

''
}

</h5>

<p class="
card-text
mb-2
">

${

e.descripcion

?

e.descripcion.substring(0,110)

:

''

}...

</p>

<p class="
mb-1
text-muted
small
">

📅
${new Date(e.fecha).toLocaleDateString('es-CO')}

</p>

${
e.lugar

?

`

<p class="
mb-3
text-muted
small
">

📍 ${e.lugar}

</p>

`

:

''
}

<div class="mt-auto">

<a

href="
ver_evento.html?id=${e.id}
"

class="
btn
btn-outline-primary
w-100
"

>

Ver detalles

</a>

</div>

</div>

</div>

</div>

`;

});

}

cargarEventos();

/* LIMPIAR */
function limpiarFiltros(){

document.getElementById(
'busqueda'
).value = '';

document.getElementById(
'desde'
).value = '';

document.getElementById(
'hasta'
).value = '';

cargarEventos();

}

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
