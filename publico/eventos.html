<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Eventos culturales
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body class="
d-flex
flex-column
min-vh-100
">

<div id="navbar"></div>

<section class="hero-eventos">

    <div class="hero-overlay">

        <h1>
            Eventos
        </h1>

        <p>
            Descubre los eventos culturales y turísticos de Quibdó
        </p>

        <div class="hero-search">

            <i class="fas fa-search"></i>

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar evento..."
            >

        </div>

    </div>

</section>

<div class="
container
py-5
flex-grow-1
">

<div
id="contenedor"
class="row"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* EVENTOS */
async function cargarEventos(){

const q =
document.getElementById(
'busqueda'
).value;

const respuesta =
await fetch(

`https://visita-quibdo2.onrender.com/eventos?q=${q}`

);

const eventos =
await respuesta.json();

const contenedor =
document.getElementById(
'contenedor'
);

/* VACIO */
if(eventos.length === 0){

contenedor.innerHTML = `

<p class="
text-center
text-muted
">

No hay eventos registrados

</p>

`;

return;

}

/* LIMPIAR */
contenedor.innerHTML = '';

/* MOSTRAR */
eventos.forEach(e=>{

contenedor.innerHTML += `

<div class="
col-md-4
mb-4
">

<div class="
card
shadow
h-100
">

<img

src="
${

e.imagen

?

e.imagen

:

'https://via.placeholder.com/400x220?text=Sin+Imagen'

}
"

class="card-img-top"

style="
height:220px;
object-fit:cover;
"

>

<div class="
card-body
d-flex
flex-column
">

<h5 class="
card-title
fw-bold
d-flex
align-items-center
gap-2
flex-wrap
">

${e.titulo}

${
e.total_resenas > 0

?

`

<span style="
color:#3483FA;
font-size:15px;
font-weight:700;
">

★ ${e.promedio_resenas}

</span>

<span style="
color:#777;
font-size:14px;
font-weight:400;
">

(${e.total_resenas})

</span>

`

:

''
}

</h5>

<p class="
card-text
mb-2
">

${

e.descripcion

?

e.descripcion.substring(0,110)

:

''

}...

</p>

<p class="
mb-1
text-muted
small
">

📅
${new Date(e.fecha).toLocaleDateString('es-CO')}

</p>

${
e.lugar

?

`

<p class="
mb-3
text-muted
small
">

📍 ${e.lugar}

</p>

`

:

''
}

<div class="mt-auto">

<a

href="
ver_evento.html?id=${e.id}
"

class="
btn
btn-detalle
w-100
"

>

Ver detalles

</a>

</div>

</div>

</div>

</div>

`;

});

}

cargarEventos();
document.getElementById(
'busqueda'
)

.addEventListener(

'input',

function(){

cargarEventos();

}

);

async function cargarBanner(){

    try{

        const respuesta =
        await fetch(
        'https://visita-quibdo2.onrender.com/banner/eventos'
        );

        const datos =
        await respuesta.json();

        if(
        datos.ok &&
        datos.imagen
        ){

            document
            .querySelector(
            '.hero-eventos'
            )
            .style.background =

            `linear-gradient(
                rgba(0,0,0,.55),
                rgba(0,0,0,.55)
            ),
            url('https://visita-quibdo2.onrender.com/${datos.imagen}') center/cover`;

        }

    }catch(error){

        console.log(error);

    }

}

cargarBanner();
</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
