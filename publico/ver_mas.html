<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ver Emprendimiento
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

.foto-negocio{

width:100%;

max-width:500px;

height:auto;

border-radius:15px;

object-fit:cover;

}

.vermas-align{

display:flex;

align-items:center;

}

@media(max-width:768px){

.vermas-align{

display:block;

text-align:center;

}

}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5">

<h2

id="titulo"

class="
text-primary
fw-bold
mb-4
text-center
d-flex
justify-content-center
align-items-center
gap-2
flex-wrap
"

></h2>

<div class="
row
vermas-align
">

<!-- FOTO -->
<div class="
col-md-6
text-center
mb-4
">

<img

id="foto"

class="foto-negocio"

src="https://via.placeholder.com/500x350?text=Sin+Imagen"

>

</div>

<!-- INFORMACION -->
<div class="
col-md-6
">

<div id="info"></div>

</div>

</div>

<div class="
text-center
mt-4
">

<a

href="emprendimientos.html"

class="
btn
btn-secondary
"

>

Volver al catálogo

</a>

</div>

<!-- RESEÑAS -->
<div class="
row
mt-5
mb-4
">

<div class="
col-lg-8
mx-auto
">

<h4 class="
fw-bold
text-primary
mb-3
">

Calificaciones y comentarios

</h4>

<form

id="formularioResena"

class="
card
p-3
mb-4
shadow
"

>

<input
type="hidden"
id="item_id"
>

<div class="mb-3">

<label class="form-label">
Tu nombre
</label>

<input

type="text"

id="nombre"

class="form-control"

placeholder="
Anónimo
"

>

</div>

<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="calificacion"

class="form-select"

required

>

<option value="">
Selecciona
</option>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="comentario"

class="form-control"

rows="4"

required

></textarea>

</div>

<div class="text-end">

<button class="
btn
btn-primary
">

Enviar reseña

</button>

</div>

</form>

<div
id="resenas"
class="list-group"
></div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* PARAMETROS URL */
const parametros =
new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');

document.getElementById(
'item_id'
).value = id;

/* EMPRENDIMIENTO */
async function cargarDatos(){

try{

const respuesta =
await fetch(

`http://localhost:3000/emprendimiento/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'titulo'
).innerHTML =
'Emprendimiento no encontrado';

return;

}

const e =
datos.emprendimiento;

/* TITULO */
document.getElementById(
'titulo'
).innerHTML =

`${e.nombre_emprendimiento}`;

/* FOTO */
document.getElementById(
'foto'
).src =

e.foto

?

e.foto

:

'https://via.placeholder.com/500x350?text=Sin+Imagen';

/* INFORMACION */
document.getElementById(
'info'
).innerHTML = `

<p>

<strong>
Categoría:
</strong>

${e.categoria || 'No disponible'}

</p>

<p>

<strong>
Ubicación:
</strong>

${e.ubicacion || 'No disponible'}

</p>

<p>

<strong>
Descripción:
</strong>

<br>

${e.descripcion || 'No disponible'}

</p>

<p>

<strong>
Horarios:
</strong>

<br>

${e.horarios || 'No disponible'}

</p>

<p>

<strong>
Servicios:
</strong>

<br>

${e.servicios || 'No disponible'}

</p>

${
e.servicios_extra

?

`

<p>

<strong>
Servicios adicionales:
</strong>

<br>

${e.servicios_extra}

</p>

`

:

''
}

<p>

<strong>
Propietario:
</strong>

${e.usuario_nombre || 'No disponible'}

</p>

<p>

<strong>
Teléfono:
</strong>

${e.usuario_telefono || 'No disponible'}

</p>

<p>

<strong>
Correo:
</strong>

${e.usuario_correo || 'No disponible'}

</p>

<a

href="
https://wa.me/57${e.usuario_telefono || ''}
"

target="_blank"

class="
btn
btn-success
w-100
mt-3
"

>

<i class="
fa-brands
fa-whatsapp
"></i>

Contactar por WhatsApp

</a>

`;

}catch(error){

console.log(error);

}

}

cargarDatos();

/* RESEÑAS */
async function cargarResenas(){

try{

const respuesta =
await fetch(

`http://localhost:3000/resenas/${id}`

);

const resenas =
await respuesta.json();

const contenedor =
document.getElementById(
'resenas'
);

/* LIMPIAR */
contenedor.innerHTML = '';

/* PROMEDIO */
let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});

if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

const titulo =
document.getElementById(
'titulo'
);

titulo.innerHTML += `

<span class="
badge
bg-warning
text-dark
">

${promedio} ★
(${resenas.length})

</span>

`;

}

/* SIN RESEÑAS */
if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

/* MOSTRAR */
resenas.forEach(r=>{

contenedor.innerHTML += `

<div class="
list-group-item
shadow-sm
mb-3
rounded
">

<div class="
d-flex
justify-content-between
align-items-center
mb-2
">

<strong>

${r.nombre || 'Anónimo'}

</strong>

<span class="
badge
bg-warning
text-dark
">

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<small class="
text-muted
">

${r.creado_en || ''}

</small>

</div>

`;

});

}catch(error){

console.log(error);

}

}

cargarResenas();

/* ENVIAR RESEÑA */
document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (evento)=>{

evento.preventDefault();

const respuesta =
await fetch(

'http://localhost:3000/crear-resena',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

item_id:id,

nombre:
document.getElementById(
'nombre'
).value,

calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

evento.target.reset();

cargarResenas();

}

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
