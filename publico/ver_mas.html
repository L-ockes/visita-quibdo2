<script>

/* PARAMETROS URL */
const parametros =
new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');

let usuarioActual = null;

/* SESION */
async function verificarSesion(){

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/sesion'

);

const datos =
await respuesta.json();

/* USUARIO */
if(datos.logueado){

usuarioActual =
datos.usuario;

}

/* NO LOGIN */
if(!datos.logueado){

document.getElementById(
'formularioResena'
).style.display =
'none';

document.getElementById(
'mensajeLogin'
).classList.remove(
'd-none'
);

}

}

(async()=>{

await verificarSesion();

await cargarDatos();

await cargarResenas();

})();

document.getElementById(
'item_id'
).value = id;

/* EMPRENDIMIENTO */
async function cargarDatos(){

try{

const respuesta =
await fetch(

`https://visita-quibdo2.onrender.com/emprendimiento/${id}`

);

const datos =
await respuesta.json();

if(
!datos.ok
||
!datos.emprendimiento
){

document.getElementById(
'titulo'
).innerHTML =

'Emprendimiento no encontrado';

return;

}

const e =
datos.emprendimiento;

window.nombreEmprendimiento =
e.nombre_emprendimiento;



/* TITULO */
document.getElementById(
'titulo'
).innerHTML =

`${e.nombre_emprendimiento}`;

/* =====================================
   IMAGEN PRINCIPAL
===================================== */

document.getElementById(
'imagenPrincipal'
).src =

e.foto

?

'https://visita-quibdo2.onrender.com/' + e.foto

:

'https://via.placeholder.com/500x350?text=Sin+Imagen';

/* =====================================
   MINIATURAS
===================================== */

const miniaturas =
document.getElementById(
'miniaturas'
);

miniaturas.innerHTML = '';


/* IMAGENES EXTRA */
if(
e.imagenes_extra
&&
e.imagenes_extra.length > 0
){

e.imagenes_extra.forEach(imagen=>{

const img =
document.createElement('img');

img.src =
'https://visita-quibdo2.onrender.com/' +
imagen.imagen;

img.className =
'miniatura';

img.onclick = ()=>{

document.getElementById(
'imagenPrincipal'
).src =

'https://visita-quibdo2.onrender.com/' +
imagen.imagen;

};

miniaturas.appendChild(img);

});

}

/* INFORMACION */
document.getElementById(
'info'
).innerHTML = `

<div class="col-md-6">

<div class="
bg-light
rounded-4
p-3
h-100
">

<p class="
fw-bold
text-primary
mb-2
">

fa-solid
fa-layer-group
me-2
"></i>

<div class="col-md-6">

<div class="col-12">

<div class="

p-4
"
>

<p class="
fw-bold
text-info
mb-2
">

fa-solid

"></i>

${e.descripcion || 'No disponible'}

</div>

<div class="col-12">

<div class="
bg-light
rounded-4
p-4
"
>

<p class="
fw-bold
text-danger

fa-solid
fa-envelope
me-2
"></i>

Correo

<p class="mb-0">

${e.usuario_correo || 'No disponible'}

</div>

<div class="col-12">

href="
https://wa.me/57${e.usuario_telefono || ''}
"

target="_blank"

class="
btn
btn-success
w-100
py-3
fw-bold
rounded-4
shadow-sm
"

>

<i class="
fa-brands
fa-whatsapp
me-2
"></i>

Contactar por WhatsApp

</a>

`;



}catch(error){

}

}

/* RESEÑAS */
async function cargarResenas(){

try{

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/resenas-emprendimiento/' + id

);

const resenas =
await respuesta.json();
window.listaResenas =
resenas;

const contenedor =
document.getElementById(
'resenas'
);

/* LIMPIAR */
contenedor.innerHTML = '';

/* PROMEDIO */
let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});


if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

/* CONTADORES */
let cinco = 0;
let cuatro = 0;
let tres = 0;
let dos = 0;
let uno = 0;

/* CONTAR */
resenas.forEach(r=>{

if(r.calificacion == 5) cinco++;
if(r.calificacion == 4) cuatro++;
if(r.calificacion == 3) tres++;
if(r.calificacion == 2) dos++;
if(r.calificacion == 1) uno++;

});

/* PORCENTAJE */
function porcentaje(valor){

return (
valor / resenas.length
) * 100;

}

/* ESTRELLAS */
function estrellasAzules(prom){

let html = '';

for(let i=1; i<=5; i++){

html += `
<i
class="fa-solid fa-star"
style="
color:#3483FA;
font-size:20px;
"
></i>
`;

}

return html;

}

document.getElementById(
'calificacionBox'
).innerHTML = `

<div
class="mx-auto text-start"
style="
max-width:420px;
"
>

<h4 class="
fw-bold
mb-4
">

Reseñas del emprendimiento

</h4>

<div class="
d-flex
align-items-center
gap-3
mb-4
">

<div style="
font-size:60px;
font-weight:300;
color:#3483FA;
line-height:1;
">

${promedio}

</div>

<div>

<div class="mb-1">

${estrellasAzules(promedio)}

</div>

<div style="
color:#777;
font-size:14px;
">

${resenas.length}
calificaciones

</div>

</div>

</div>

${crearBarra(5, cinco)}
${crearBarra(4, cuatro)}
${crearBarra(3, tres)}
${crearBarra(2, dos)}
${crearBarra(1, uno)}

</div>

`;

/* BARRAS */
function crearBarra(
numero,
cantidad
){

return `

<div class="
d-flex
align-items-center
gap-2
mb-2
">

<div style="
width:15px;
font-size:14px;
color:#555;
">

${numero}

</div>

<div style="
flex:1;
height:8px;
background:#E5E5E5;
border-radius:20px;
overflow:hidden;
">

<div style="
width:${porcentaje(cantidad)}%;
height:100%;
background:#3483FA;
border-radius:20px;
">

</div>

</div>

<div style="
color:#999;
font-size:14px;
">

★

</div>

</div>

`;

}

}

/* SIN RESEÑAS */
if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

/* MOSTRAR */
let html = '';

resenas.forEach(r=>{

html += `

<div class="
list-group-item
shadow-sm
mb-3
rounded
">

<div class="
d-flex
justify-content-between
align-items-center
mb-2
">

<strong>

${r.nombre || 'Anónimo'}

</strong>

<span

style="
color:#3483FA;
font-weight:700;
font-size:15px;
"
>

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<div class="
d-flex
justify-content-between
align-items-center
mt-2
">

<small class="
text-muted
">

${new Date(
r.creado_en
).toLocaleString()}

</small>

${
usuarioActual
&&
Number(usuarioActual.id)
===
Number(r.usuario_id)

?

`

<div class="dropdown">

<button

class="
btn
btn-sm
border-0
shadow-none
text-muted
"

data-bs-toggle="dropdown"

>

<i class="
fa-solid
fa-ellipsis-vertical
"></i>

</button>

<ul class="
dropdown-menu
dropdown-menu-end
shadow
border-0
">

<li>

<a

class="
dropdown-item
"

href="#"

onclick="
abrirEditarResena(${r.id})
"

>

Editar

</a>

</li>

<li>

<a

class="
dropdown-item
text-danger
"

href="#"

onclick="
eliminarResena(${r.id})
"

>

Eliminar

</a>

</li>

</ul>

</div>

`

:

''
}

</div>

</div>

`;

});

contenedor.innerHTML = html;

}catch(error){

console.log(error);

}

}


/* ENVIAR RESEÑA */
document.getElementById(
'formularioResena'
).onsubmit = null;

document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (evento)=>{

evento.preventDefault();

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/crear-resena-emprendimiento',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({
 
item_id:id,

calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

evento.target.reset();

cargarResenas();

}

}

);

/* =====================================
   ZOOM IMAGEN
===================================== */

document.addEventListener(

'mousemove',

function(e){

const contenedor =
document.getElementById(
'contenedorZoom'
);

const imagen =
document.getElementById(
'imagenPrincipal'
);

if(
!contenedor
||
!imagen
){

return;

}

const rect =
contenedor.getBoundingClientRect();

const x =
e.clientX - rect.left;

const y =
e.clientY - rect.top;

const dentro =

x >= 0
&&
y >= 0
&&
x <= rect.width
&&
y <= rect.height;

if(dentro){

const posX =
(x / rect.width) * 100;

const posY =
(y / rect.height) * 100;

imagen.style.transform =
'scale(2)';

imagen.style.transformOrigin =
`${posX}% ${posY}%`;

}else{

imagen.style.transform =
'scale(1)';

}

});

/* =====================================
   ELIMINAR RESEÑA
===================================== */

async function eliminarResena(id){

try{

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/eliminar-resena-emprendimiento',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({
id:id,
tipo:'emprendimiento'
})

}

);

const resultado =
await respuesta.json();

console.log(resultado);

/* OK */
if(resultado.ok){

cargarResenas();

}

/* ERROR */
else{

alert(
'No se pudo eliminar'
);

}

}catch(error){

console.log(error);

}

}

/* =====================================
   ABRIR EDITAR
===================================== */

function abrirEditarResena(
id
){

const resena =
window.listaResenas.find(
r=>r.id == id
);

if(!resena){
return;
}

/* ID */
document.getElementById(
'editarResenaId'
).value =
resena.id;

/* CALIFICACION */
document.getElementById(
'editarCalificacion'
).value =
resena.calificacion;

/* COMENTARIO */
document.getElementById(
'editarComentario'
).value =
resena.comentario;

/* MODAL */
const modal =
new bootstrap.Modal(

document.getElementById(
'modalEditarResena'
)

);

modal.show();

}

/* =====================================
   GUARDAR EDICION
===================================== */

async function guardarEditarResena(){

try{

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/editar-resena-emprendimiento',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

id:
document.getElementById(
'editarResenaId'
).value,

calificacion:
document.getElementById(
'editarCalificacion'
).value,

comentario:
document.getElementById(
'editarComentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

/* CERRAR */
bootstrap.Modal
.getInstance(

document.getElementById(
'modalEditarResena'
)

).hide();

/* RECARGAR */
cargarResenas();

}

}catch(error){

console.log(error);

}

}

</script>

<script src="
