<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ver Emprendimiento
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

.card{

transition:0.3s;

}

.card:hover{

transform:translateY(-3px);

}

/* =====================================
   IMAGEN PRINCIPAL
===================================== */

#foto{

width:100%;
height:550px;

object-fit:contain;

background:#fff;

border-radius:20px;

}

/* =====================================
   MINIATURAS
===================================== */

.miniaturas{

display:flex;

gap:10px;

margin-top:15px;

flex-wrap:wrap;

justify-content:center;

}

.miniatura{

width:90px;
height:90px;

object-fit:cover;

border-radius:15px;

cursor:pointer;

border:3px solid transparent;

transition:0.2s;

}

.miniatura:hover{

transform:scale(1.05);

border-color:#0d6efd;

}

.vermas-align{

display:flex;

align-items:center;

}

@media(max-width:768px){

.vermas-align{

display:block;

text-align:center;

}

}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5">

<h2

id="titulo"

class="
text-primary
fw-bold
mb-4
text-center
d-flex
justify-content-center
align-items-center
gap-2
flex-wrap
"

></h2>

<div class="row">

<div class="
col-12
mb-4
">

<div class="
card
shadow-lg
border-0
rounded-4
overflow-hidden
">

<img

id="foto"

class="
w-100
"

style="
max-height:550px;
object-fit:cover;
"

src="
https://via.placeholder.com/1200x500?text=Sin+Imagen
"

>

<div
id="miniaturas"
class="miniaturas"
></div>

<div class="
p-4
text-center
">

<div
id="calificacionBox"
></div>

</div>

</div>

</div>

<div class="
col-12
">

<div class="
card
shadow-lg
border-0
rounded-4
p-4
"
>

<h4 class="
fw-bold
text-primary
mb-4
">

Información del emprendimiento

</h4>

<div
id="info"
class="
row
g-4
"
></div>

</div>

</div>

</div>

<!-- INFORMACION -->
<div class="
col-md-6
">

</div>

</div>

<div class="
text-center
mt-4
">

<a

href="emprendimientos.html"

class="
btn
btn-secondary
"

>

Volver al catálogo

</a>

</div>

<!-- RESEÑAS -->
<div class="
row
mt-5
mb-4
">

<div class="
col-lg-8
mx-auto
">

<h4 class="
fw-bold
text-primary
mb-3
">

Calificaciones y comentarios

</h4>

<div
id="mensajeLogin"
class="
alert
alert-warning
d-none
mb-3
"
>

Debes iniciar sesión para escribir una reseña.

</div>

<form

id="formularioResena"

class="
card
p-3
mb-4
shadow
"

>

<input
type="hidden"
id="item_id"
>



<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="calificacion"

class="form-select"

required

>

<option value="">
Selecciona
</option>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="comentario"

class="form-control"

rows="4"

required

></textarea>

</div>

<div class="text-end">

<button class="
btn
btn-primary
">

Enviar reseña

</button>

</div>

</form>

<div
id="resenas"
class="list-group"
></div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* PARAMETROS URL */
const parametros =
new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');

/* SESION */
async function verificarSesion(){

const respuesta =
await fetch(

'http://localhost:3000/sesion'

);

const datos =
await respuesta.json();

/* NO LOGIN */
if(!datos.logueado){

document.getElementById(
'formularioResena'
).style.display =
'none';

document.getElementById(
'mensajeLogin'
).classList.remove(
'd-none'
);

}

}

verificarSesion();

document.getElementById(
'item_id'
).value = id;

/* EMPRENDIMIENTO */
async function cargarDatos(){

try{

const respuesta =
await fetch(

`http://localhost:3000/emprendimiento/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'titulo'
).innerHTML =
'Emprendimiento no encontrado';

return;

}

const e =
datos.emprendimiento;

window.nombreEmprendimiento =
e.nombre_emprendimiento;



/* TITULO */
document.getElementById(
'titulo'
).innerHTML =

`${e.nombre_emprendimiento}`;

/* =====================================
   IMAGEN PRINCIPAL
===================================== */

document.getElementById(
'foto'
).src =

e.foto

?

e.foto

:

'https://via.placeholder.com/500x350?text=Sin+Imagen';

/* =====================================
   MINIATURAS
===================================== */

const miniaturas =
document.getElementById(
'miniaturas'
);

miniaturas.innerHTML = '';

/* IMAGEN PRINCIPAL */
if(e.foto){

const img =
document.createElement('img');

img.src = e.foto;

img.className =
'miniatura';

img.onclick = ()=>{

document.getElementById(
'foto'
).src = e.foto;

};

miniaturas.appendChild(img);

}

/* IMAGENES EXTRA */
if(
e.imagenes_extra
&&
e.imagenes_extra.length > 0
){

e.imagenes_extra.forEach(imagen=>{

const img =
document.createElement('img');

img.src = imagen.imagen;

img.className =
'miniatura';

img.onclick = ()=>{

document.getElementById(
'foto'
).src = imagen.imagen;

};

miniaturas.appendChild(img);

});

}

/* INFORMACION */
document.getElementById(
'info'
).innerHTML = `

<div class="col-md-6">

<div class="
bg-light
rounded-4
p-3
h-100
">

<p class="
fw-bold
text-primary
mb-2
">

<i class="
fa-solid
fa-layer-group
me-2
"></i>

Categoría

</p>

<p class="mb-0">

${e.categoria || 'No disponible'}

</p>

</div>

</div>

<div class="col-md-6">

<div class="
bg-light
rounded-4
p-3
h-100
">

<p class="
fw-bold
text-danger
mb-2
">

<i class="
fa-solid
fa-location-dot
me-2
"></i>

Ubicación

</p>

<p class="mb-0">

${e.ubicacion || 'No disponible'}

</p>

</div>

</div>

<div class="col-md-6">

<div class="
bg-light
rounded-4
p-3
h-100
">

<p class="
fw-bold
text-success
mb-2
">

<i class="
fa-solid
fa-clock
me-2
"></i>

Horarios

</p>

<p class="mb-0">

${e.horarios || 'No disponible'}

</p>

</div>

</div>

<div class="col-md-6">

<div class="
bg-light
rounded-4
p-3
h-100
">

<p class="
fw-bold
text-warning
mb-2
">

<i class="
fa-solid
fa-handshake
me-2
"></i>

Servicios

</p>

<p class="mb-0">

${e.servicios || 'No disponible'}

</p>

</div>

</div>

<div class="col-md-6">

<div class="
bg-light
rounded-4
p-3
h-100
">

<p class="
fw-bold
text-secondary
mb-2
">

<i class="
fa-solid
fa-user
me-2
"></i>

Propietario

</p>

<p class="mb-0">

${e.usuario_nombre || 'No disponible'}

</p>

</div>

</div>

<div class="col-md-6">

<div class="
bg-light
rounded-4
p-3
h-100
">

<p class="
fw-bold
text-success
mb-2
">

<i class="
fa-solid
fa-phone
me-2
"></i>

Teléfono

</p>

<p class="mb-0">

${e.usuario_telefono || 'No disponible'}

</p>

</div>

</div>

<div class="col-12">

<div class="
bg-light
rounded-4
p-4
"
>

<p class="
fw-bold
text-info
mb-2
">

<i class="
fa-solid
fa-align-left
me-2
"></i>

Descripción

</p>

<p class="mb-0">

${e.descripcion || 'No disponible'}

</p>

</div>

</div>

<div class="col-12">

<div class="
bg-light
rounded-4
p-4
"
>

<p class="
fw-bold
text-danger
mb-2
">

<i class="
fa-solid
fa-envelope
me-2
"></i>

Correo

</p>

<p class="mb-0">

${e.usuario_correo || 'No disponible'}

</p>

</div>

</div>

<div class="col-12">

<a

href="
https://wa.me/57${e.usuario_telefono || ''}
"

target="_blank"

class="
btn
btn-success
w-100
py-3
fw-bold
rounded-4
shadow-sm
"

>

<i class="
fa-brands
fa-whatsapp
me-2
"></i>

Contactar por WhatsApp

</a>

</div>

`;

}catch(error){

console.log(error);

}

}

cargarDatos();

/* RESEÑAS */
async function cargarResenas(){

try{

const respuesta =
await fetch(

'http://localhost:3000/resenas-emprendimiento/' + id

);

const resenas =
await respuesta.json();

const contenedor =
document.getElementById(
'resenas'
);

/* LIMPIAR */
contenedor.innerHTML = '';

/* PROMEDIO */
let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});


if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

/* CALIFICACION */
document.getElementById(
'calificacionBox'
).innerHTML = `

<div class="
d-inline-block
bg-warning
text-dark
fw-bold
px-4
py-2
rounded-3
shadow-sm
fs-5
">

${promedio} ★
(${resenas.length} reseñas)

</div>

`;

}

/* SIN RESEÑAS */
if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

/* MOSTRAR */
let html = '';

resenas.forEach(r=>{

html += `

<div class="
list-group-item
shadow-sm
mb-3
rounded
">

<div class="
d-flex
justify-content-between
align-items-center
mb-2
">

<strong>

${r.nombre || 'Anónimo'}

</strong>

<span class="
badge
bg-warning
text-dark
">

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<small class="
text-muted
">

${new Date(
r.creado_en
).toLocaleString()}

</small>

</div>

`;

});

contenedor.innerHTML = html;

}catch(error){

console.log(error);

}

}

cargarResenas();

/* ENVIAR RESEÑA */
document.getElementById(
'formularioResena'
).onsubmit = null;

document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (evento)=>{

evento.preventDefault();

const respuesta =
await fetch(

'http://localhost:3000/crear-resena-emprendimiento',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({
 
item_id:id,

calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

evento.target.reset();

cargarResenas();

}

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
