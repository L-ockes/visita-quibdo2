<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Editar Emprendimiento
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5">

<h2 class="
text-primary
fw-bold
mb-4
text-center
">

Editar Mi Emprendimiento

</h2>

<form

id="formulario"

enctype="multipart/form-data"

class="
p-4
shadow
rounded
bg-white
"

>

<!-- Nombre -->
<div class="mb-3">

<label class="form-label">
Nombre del Emprendimiento
</label>

<input

type="text"

name="nombre_emprendimiento"

id="nombre_emprendimiento"

class="form-control"

required

>

</div>

<!-- Categoria -->
<div class="mb-3">

<label class="form-label">
Categoría
</label>

<select

name="categoria"

id="categoriaSelect"

class="form-control"

required

></select>

<input

type="text"

name="categoria_nueva"

id="categoriaNueva"

class="
form-control
mt-2
"

placeholder="
Escribe la nueva categoría
"

style="
display:none;
"

>

</div>

<!-- Descripcion -->
<div class="mb-3">

<label class="form-label">
Descripción
</label>

<textarea

name="descripcion"

id="descripcion"

class="form-control"

required

></textarea>

</div>

<!-- Ubicacion -->
<div class="mb-3">

<label class="form-label">
Ubicación
</label>

<input

type="text"

name="ubicacion"

id="ubicacion"

class="form-control"

required

>

</div>

<!-- Horarios -->
<div class="mb-3">

<label class="form-label">
Horarios
</label>

<textarea

name="horarios"

id="horarios"

class="form-control"

></textarea>

</div>

<!-- Servicios -->
<div class="mb-3">

<label class="form-label">
Servicio Ofrecido
</label>

<select

name="servicios"

id="servicioSelect"

class="form-control"

required

></select>

<input

type="text"

name="servicio_nuevo"

id="servicioNuevo"

class="
form-control
mt-2
"

placeholder="
Escribe un nuevo servicio
"

style="
display:none;
"

>

</div>

<!-- Foto -->
<div class="mb-3">

<label class="form-label">
Foto actual
</label>

<br>

<img

id="fotoActual"

src="https://via.placeholder.com/200"

width="200"

class="
rounded
mb-3
"

>

<br>

<label class="form-label">
Cambiar foto
</label>

<input

type="file"

name="foto"

class="form-control"

>

</div>

<!-- Boton -->
<button class="
btn
btn-success
w-100
">

Guardar Cambios

</button>

<div
id="mensaje"
class="mt-3"
></div>

</form>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* CARGAR CATEGORIAS */
async function cargarCategorias(){

const respuesta =
await fetch(
'http://localhost:3000/categorias'
);

const categorias =
await respuesta.json();

const select =
document.getElementById(
'categoriaSelect'
);

select.innerHTML = '';

categorias.forEach(cat=>{

select.innerHTML += `

<option>

${cat.nombre_categoria}

</option>

`;

});

select.innerHTML += `
<option>
Otro
</option>
`;

}

/* CARGAR SERVICIOS */
async function cargarServicios(){

const respuesta =
await fetch(
'http://localhost:3000/servicios'
);

const servicios =
await respuesta.json();

const select =
document.getElementById(
'servicioSelect'
);

select.innerHTML = '';

servicios.forEach(servicio=>{

select.innerHTML += `

<option>

${servicio.nombre_servicio}

</option>

`;

});

select.innerHTML += `
<option>
Otro
</option>
`;

}

/* DATOS */
async function cargarDatos(){

const respuesta =
await fetch(
'http://localhost:3000/panel-datos'
);

const datos =
await respuesta.json();

if(!datos.ok || !datos.tieneDatos){

window.location.href =
'panel.html';

return;

}

const e =
datos.emprendimiento;

/* CAMPOS */
document.getElementById(
'nombre_emprendimiento'
).value =
e.nombre_emprendimiento || '';

document.getElementById(
'descripcion'
).value =
e.descripcion || '';

document.getElementById(
'ubicacion'
).value =
e.ubicacion || '';

document.getElementById(
'horarios'
).value =
e.horarios || '';

/* FOTO */
document.getElementById(
'fotoActual'
).src =

e.foto

?

'http://localhost:3000/' + e.foto

:

'https://via.placeholder.com/200';

/* SELECT */
setTimeout(()=>{

document.getElementById(
'categoriaSelect'
).value =
e.categoria || '';

document.getElementById(
'servicioSelect'
).value =
e.servicios || '';

},500);

}

/* INICIO */
cargarCategorias();
cargarServicios();
cargarDatos();

/* OTRO */
document.getElementById(
'categoriaSelect'
)

.addEventListener(
'change',
function(){

document.getElementById(
'categoriaNueva'
).style.display =

this.value === 'Otro'

?

'block'

:

'none';

}
);

document.getElementById(
'servicioSelect'
)

.addEventListener(
'change',
function(){

document.getElementById(
'servicioNuevo'
).style.display =

this.value === 'Otro'

?

'block'

:

'none';

}
);

/* GUARDAR */
document.getElementById(
'formulario'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const datos =
new FormData(
e.target
);

const respuesta =
await fetch(

'http://localhost:3000/editar-emprendimiento',

{

method:'POST',

body:datos

}

);

const resultado =
await respuesta.json();

document.getElementById(
'mensaje'
).innerHTML =

resultado.ok

?

`

<div class="
alert
alert-success
">

${resultado.mensaje}

</div>

`

:

`

<div class="
alert
alert-danger
">

${resultado.mensaje}

</div>

`;

}

);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
