<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Emprendimientos
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body>

<div id="navbar"></div>

<div class="container mt-5 mb-5">

<h2 class="
text-primary
fw-bold
mb-4
text-center
">

Emprendimientos

</h2>

<!-- FILTROS -->
<div class="
row
g-3
mb-4
">

<!-- BUSQUEDA -->
<div class="col-md-8">

<input

type="search"

id="busqueda"

class="form-control"

placeholder="
Buscar emprendimiento
"

>

</div>

<!-- CATEGORIA -->
<div class="col-md-4">

<select

id="categoria"

class="form-select"

>

<option value="">
Todas las categorías
</option>

</select>

</div>

</div>

<!-- TARJETAS -->
<div
id="contenedor"
class="row"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* CATEGORIAS */
async function cargarCategorias(){

const respuesta =
await fetch(
'http://localhost:3000/categorias'
);

const categorias =
await respuesta.json();

const select =
document.getElementById(
'categoria'
);

categorias.forEach(c=>{

select.innerHTML += `

<option value="
${c.nombre_categoria}
">

${c.nombre_categoria}

</option>

`;

});

}

cargarCategorias();

/* EMPRENDIMIENTOS */
async function cargarEmprendimientos(){

const q =
document.getElementById(
'busqueda'
).value;

const categoria =
document.getElementById(
'categoria'
).value;

const respuesta =
await fetch(

`http://localhost:3000/emprendimientos?q=${q}&categoria=${categoria}`

);

const emprendimientos =
await respuesta.json();

const contenedor =
document.getElementById(
'contenedor'
);

/* VACIO */
if(emprendimientos.length === 0){

contenedor.innerHTML = `

<p class="
text-center
text-muted
">

No se encontraron resultados

</p>

`;

return;

}

/* LIMPIAR */
contenedor.innerHTML = '';

/* MOSTRAR */
emprendimientos.forEach(e=>{

contenedor.innerHTML += `

<div class="
col-md-4
mb-4
">

<div class="
card
shadow
h-100
">

<!-- FOTO -->
<img

src="
${
e.foto

?

'http://localhost:3000/' + e.foto

:

'https://via.placeholder.com/400x200?text=Sin+Imagen'
}
"

class="card-img-top"

style="
height:200px;
object-fit:cover;
"

>

<div class="
card-body
d-flex
flex-column
">

<h5 class="
card-title
fw-bold
text-primary
d-flex
align-items-center
gap-2
flex-wrap
">

${e.nombre_emprendimiento}

${
e.total_resenas > 0

?

`

<span class="
badge
bg-warning
text-dark
">

${e.promedio_resenas} ★
(${e.total_resenas})

</span>

`

:

''
}

</h5>

<p>

<strong>
Categoría:
</strong>

${e.categoria}

</p>

<p>

<strong>
Ubicación:
</strong>

${e.ubicacion}

</p>

<p>

${
e.descripcion
?
e.descripcion.substring(0,80)
:
''
}...

</p>

<div class="mt-auto">

<a

href="
ver_mas.html?id=${e.id}
"

class="
btn
btn-primary
w-100
"

>

Ver más

</a>

</div>

</div>

</div>

</div>

`;

});

}

cargarEmprendimientos();

/* FILTROS */
document.getElementById(
'busqueda'
)

.addEventListener(
'input',
cargarEmprendimientos
);

document.getElementById(
'categoria'
)

.addEventListener(
'change',
cargarEmprendimientos
);

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
