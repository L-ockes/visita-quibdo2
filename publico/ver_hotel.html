<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ver Hotel
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
/>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

#mapa{

height:500px;

width:100%;

border-radius:20px;

margin-top:30px;

}

.foto-hotel{

width:100%;

height:450px;

object-fit:cover;

}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="
container
mt-5
mb-5
">

<!-- HOTEL -->
<div id="hotel"></div>

<!-- MAPA -->
<div id="mapa"></div>

<!-- VOLVER -->
<div class="
text-center
mt-4
">

<a

href="hoteles.html"

class="
btn
btn-secondary
"

>

Volver

</a>

</div>

<!-- RESEÑAS -->
<div class="
row
mt-5
mb-4
">

<div class="
col-lg-8
mx-auto
">

<h4 class="
fw-bold
text-primary
mb-3
">

Calificaciones y comentarios

</h4>

<div id="contenedorFormulario"></div>

<div
id="resenas"
class="list-group"
></div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>

<script src="footer.js"></script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

<script src="
https://unpkg.com/leaflet/dist/leaflet.js
"></script>

<script src="
https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js
"></script>

<script>

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get('id');

/* =====================================
   HOTEL
===================================== */

async function cargarHotel(){

const respuesta =
await fetch(

`http://localhost:3000/hotel/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'hotel'
).innerHTML = `

<div class="
alert
alert-danger
">

Hotel no encontrado

</div>

`;

return;

}

const hotel =
datos.hotel;

window.nombreHotel =
hotel.nombre;

/* HTML */
document.getElementById(
'hotel'
).innerHTML = `

<div class="
card
shadow-lg
border-0
overflow-hidden
">

<img

src="
${
hotel.imagen

?

hotel.imagen.startsWith('http')

?

hotel.imagen

:

'http://localhost:3000/' + hotel.imagen

:

'https://via.placeholder.com/1200x500'
}
"

class="
foto-hotel
"

>

<div class="card-body p-4">

<h1 class="
fw-bold
text-primary
mb-3
">

${hotel.nombre}

</h1>

<p class="
fs-5
text-warning
fw-bold
">

⭐ ${hotel.estrellas || '0'}

</p>

<p class="
fs-5
">

${hotel.descripcion || ''}

</p>

<hr>

<p>

📞
<strong>Teléfono:</strong>

${hotel.telefono || 'No disponible'}

</p>

<p>

🌐
<strong>Sitio web:</strong>

${
hotel.sitio_web

?

`<a
href="${hotel.sitio_web}"
target="_blank"
>

${hotel.sitio_web}

</a>`

:

'No disponible'
}

</p>

<p>

📍
<strong>Dirección:</strong>

${hotel.direccion || ''}

</p>

<p>

🧭
<strong>Indicaciones:</strong>

${hotel.indicaciones || ''}

</p>

</div>

</div>

`;

/* =====================================
   MAPA
===================================== */

const mapa = L.map(
'mapa'
).setView(

[
hotel.latitud,
hotel.longitud
],

15

);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{
attribution:
'© OpenStreetMap'
}

).addTo(mapa);

/* UBICACION USUARIO */
navigator.geolocation.getCurrentPosition(

(posicion)=>{

const latUsuario =
posicion.coords.latitude;

const lngUsuario =
posicion.coords.longitude;

/* MARCADOR HOTEL */
L.marker(

[
hotel.latitud,
hotel.longitud
]

)

.addTo(mapa)

.bindPopup(
hotel.nombre
)

.openPopup();

/* MARCADOR USUARIO */
L.marker(

[
latUsuario,
lngUsuario
]

)

.addTo(mapa)

.bindPopup(
'Tu ubicación'
);

/* RUTA */
L.Routing.control({

waypoints:[

L.latLng(
latUsuario,
lngUsuario
),

L.latLng(
hotel.latitud,
hotel.longitud
)

],

routeWhileDragging:false,

show:false,

addWaypoints:false,

draggableWaypoints:false,

fitSelectedRoutes:true

})

.addTo(mapa);

},

()=>{

console.log(
'No se pudo obtener ubicación'
);

}

);

}

/* =====================================
   RESEÑAS
===================================== */

async function cargarResenas(){

const respuesta =
await fetch(

'http://localhost:3000/resenas-hotel/' + id

);

const resenas =
await respuesta.json();

const contenedor =
document.getElementById(
'resenas'
);

contenedor.innerHTML = '';

let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});


if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

document.querySelector(
'#hotel h1'
).innerHTML = `

${window.nombreHotel}

<span class="
badge
bg-warning
text-dark
ms-2
">

${promedio} ★
(${resenas.length})

</span>

`;

}

if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

let html = '';

resenas.forEach(r=>{

html += `

<div class="
list-group-item
mb-3
">

<div class="
d-flex
justify-content-between
align-items-center
mb-1
">

<strong>

${r.nombre}

</strong>

<span class="
badge
bg-warning
text-dark
">

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<small class="
text-muted
">

${new Date(r.creado_en).toLocaleString()}

</small>

</div>

`;

});

contenedor.innerHTML = html;

}

/* =====================================
   SESION
===================================== */

async function verificarSesion(){

const respuesta =
await fetch(

'http://localhost:3000/sesion-actual',

{
credentials:'include'
}

);

const datos =
await respuesta.json();

const contenedor =
document.getElementById(
'contenedorFormulario'
);

/* NO LOGIN */
if(!datos.logueado){

contenedor.innerHTML = `

<div class="
alert
alert-warning
text-center
">

Debes iniciar sesión para escribir una reseña.

</div>

`;

return;

}

/* FORMULARIO */
contenedor.innerHTML = `

<form

id="formularioResena"

class="
card
p-3
mb-3
"

>

<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="calificacion"

class="form-select"

required

>

<option value="">
Selecciona una opción
</option>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="comentario"

class="form-control"

rows="4"

required

></textarea>

</div>

<div class="text-end">

<button class="
btn
btn-primary
">

Enviar reseña

</button>

</div>

</form>

`;

/* EVENTO */
document.getElementById(
'formularioResena'
).onsubmit = null;

document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const respuesta =
await fetch(

'http://localhost:3000/crear-resena-hotel',

{

method:'POST',

credentials:'include',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

item_id:id,

calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

e.target.reset();

cargarResenas();

}

else{

alert(
resultado.mensaje
);

}

}

);

}

/* =====================================
   INICIAR
===================================== */

cargarHotel();

cargarResenas();

verificarSesion();

</script>

</body>
</html>
