<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Ver Hotel
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
/>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

#mapa{

height:500px;

width:100%;

border-radius:20px;

margin-top:30px;

}

.foto-hotel{

width:100%;

height:450px;

object-fit:cover;

}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="
container
mt-5
mb-5
">

<!-- HOTEL -->
<div id="hotel"></div>

<!-- MAPA -->
<div id="mapa"></div>

<!-- VOLVER -->
<div class="
text-center
mt-4
">

<a

href="hoteles.html"

class="
btn
btn-secondary
"

>

Volver

</a>

</div>

<!-- RESEÑAS -->
<div class="
row
mt-5
mb-4
">

<div class="
col-lg-8
mx-auto
">

<h4 class="
fw-bold
text-primary
mb-3
">

Calificaciones y comentarios

</h4>

<div id="contenedorFormulario"></div>

<div class="
row
g-4
align-items-start
">

<!-- RESUMEN -->
<div class="
col-lg-4
">

<div
id="calificacionBox"
></div>

</div>

<!-- COMENTARIOS -->
<div class="
col-lg-8
">

<div
id="resenas"
class="list-group"
></div>

</div>

</div>

</div>

</div>

</div>

<!-- =====================================
     MODAL EDITAR RESEÑA
===================================== -->

<div
class="
modal
fade
"
id="modalEditarResena"
tabindex="-1"
>

<div class="
modal-dialog
modal-dialog-centered
">

<div class="
modal-content
border-0
shadow
rounded-4
">

<div class="
modal-header
border-0
">

<h5 class="
modal-title
fw-bold
text-primary
">

Editar reseña

</h5>

<button

type="button"

class="btn-close"

data-bs-dismiss="modal"

></button>

</div>

<div class="
modal-body
">

<input
type="hidden"
id="editarResenaId"
>

<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="editarCalificacion"

class="form-select"

>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="editarComentario"

class="form-control"

rows="4"

></textarea>

</div>

</div>

<div class="
modal-footer
border-0
">

<button

class="
btn
btn-secondary
"

data-bs-dismiss="modal"

>

Cancelar

</button>

<button

class="
btn
btn-primary
"

onclick="
guardarEditarResena()
"

>

Guardar cambios

</button>

</div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>

<script src="footer.js"></script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

<script src="
https://unpkg.com/leaflet/dist/leaflet.js
"></script>

<script src="
https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js
"></script>

<script>

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get('id');
let usuarioActual = null;

/* =====================================
   HOTEL
===================================== */

async function cargarHotel(){

const respuesta =
await fetch(

`https://visita-quibdo2.onrender.com/hotel/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'hotel'
).innerHTML = `

<div class="
alert
alert-danger
">

Hotel no encontrado

</div>

`;

return;

}

const hotel =
datos.hotel;

window.nombreHotel =
hotel.nombre;

/* HTML */
document.getElementById(
'hotel'
).innerHTML = `

<div class="
card
shadow-lg
border-0
overflow-hidden
">

<img

src="
${
hotel.imagen

?

hotel.imagen.startsWith('http')

?

hotel.imagen

:

'https://visita-quibdo2.onrender.com/' + hotel.imagen

:

'https://via.placeholder.com/1200x500'
}
"

class="
foto-hotel
"

>

<div class="card-body p-4">

<h1 class="
fw-bold
text-primary
mb-3
">

${hotel.nombre}

</h1>

<p class="
fs-5
text-warning
fw-bold
">

⭐ ${hotel.estrellas || '0'}

</p>

<p class="
fs-5
">

${hotel.descripcion || ''}

</p>

<hr>

<p>

📞
<strong>Teléfono:</strong>

${hotel.telefono || 'No disponible'}

</p>

<p>

🌐
<strong>Sitio web:</strong>

${
hotel.sitio_web

?

`<a
href="${hotel.sitio_web}"
target="_blank"
>

${hotel.sitio_web}

</a>`

:

'No disponible'
}

</p>

<p>

📍
<strong>Dirección:</strong>

${hotel.direccion || ''}

</p>

<p>

🧭
<strong>Indicaciones:</strong>

${hotel.indicaciones || ''}

</p>

</div>

</div>

`;

/* =====================================
   MAPA
===================================== */

const mapa = L.map(
'mapa'
).setView(

[
hotel.latitud,
hotel.longitud
],

15

);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{
attribution:
'© OpenStreetMap'
}

).addTo(mapa);

/* UBICACION USUARIO */
navigator.geolocation.getCurrentPosition(

(posicion)=>{

const latUsuario =
posicion.coords.latitude;

const lngUsuario =
posicion.coords.longitude;

/* MARCADOR HOTEL */
L.marker(

[
hotel.latitud,
hotel.longitud
]

)

.addTo(mapa)

.bindPopup(
hotel.nombre
)

.openPopup();

/* MARCADOR USUARIO */
L.marker(

[
latUsuario,
lngUsuario
]

)

.addTo(mapa)

.bindPopup(
'Tu ubicación'
);

/* RUTA */
L.Routing.control({

waypoints:[

L.latLng(
latUsuario,
lngUsuario
),

L.latLng(
hotel.latitud,
hotel.longitud
)

],

routeWhileDragging:false,

show:false,

addWaypoints:false,

draggableWaypoints:false,

fitSelectedRoutes:true

})

.addTo(mapa);

},

()=>{

console.log(
'No se pudo obtener ubicación'
);

}

);

}

/* =====================================
   RESEÑAS
===================================== */

async function cargarResenas(){

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/resenas-hotel/' + id

);

const resenas =
await respuesta.json();
window.listaResenas =
resenas;

const contenedor =
document.getElementById(
'resenas'
);

contenedor.innerHTML = '';

let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});


if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

document.querySelector(
'#hotel h1'
).innerHTML =

window.nombreHotel;

}

/* CONTADORES */
let cinco = 0;
let cuatro = 0;
let tres = 0;
let dos = 0;
let uno = 0;

/* CONTAR */
resenas.forEach(r=>{

if(r.calificacion == 5) cinco++;
if(r.calificacion == 4) cuatro++;
if(r.calificacion == 3) tres++;
if(r.calificacion == 2) dos++;
if(r.calificacion == 1) uno++;

});

/* PORCENTAJE */
function porcentaje(valor){

return (
valor / resenas.length
) * 100;

}

/* ESTRELLAS */
function estrellasAzules(){

let html = '';

for(let i=1; i<=5; i++){

html += `
<i
class="fa-solid fa-star"
style="
color:#3483FA;
font-size:20px;
"
></i>
`;

}

return html;

}

/* CAJA */
document.getElementById(
'calificacionBox'
).innerHTML = `

<div
class="mx-auto text-start"
style="
max-width:420px;
"
>

<h4 class="
fw-bold
mb-4
">

Reseñas del hotel

</h4>

<div class="
d-flex
align-items-center
gap-3
mb-4
">

<div style="
font-size:60px;
font-weight:300;
color:#3483FA;
line-height:1;
">

${promedio}

</div>

<div>

<div class="mb-1">

${estrellasAzules()}

</div>

<div style="
color:#777;
font-size:14px;
">

${resenas.length}
calificaciones

</div>

</div>

</div>

${crearBarra(5, cinco)}
${crearBarra(4, cuatro)}
${crearBarra(3, tres)}
${crearBarra(2, dos)}
${crearBarra(1, uno)}

</div>

`;

/* BARRAS */
function crearBarra(
numero,
cantidad
){

return `

<div class="
d-flex
align-items-center
gap-2
mb-2
">

<div style="
width:15px;
font-size:14px;
color:#555;
">

${numero}

</div>

<div style="
flex:1;
height:8px;
background:#E5E5E5;
border-radius:20px;
overflow:hidden;
">

<div style="
width:${porcentaje(cantidad)}%;
height:100%;
background:#3483FA;
border-radius:20px;
">

</div>

</div>

<div style="
color:#999;
font-size:14px;
">

★

</div>

</div>

`;

}

if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

let html = '';

resenas.forEach(r=>{

html += `

<div class="
list-group-item
mb-3
">

<div class="
d-flex
justify-content-between
align-items-start
mb-1
">

<strong>

${r.nombre}

</strong>

<div class="
d-flex
flex-column
align-items-end
">

<span

style="
color:#3483FA;
font-weight:700;
font-size:15px;
"
>

${r.calificacion} ★

</span>

</div>

</div>

<p class="
mb-1
">

${r.comentario}

<div class="
d-flex
justify-content-between
align-items-center
mt-2
">

<small class="
text-muted
">

${new Date(
r.creado_en
).toLocaleString()}

</small>

${
usuarioActual
&&
Number(usuarioActual.id)
===
Number(r.usuario_id)

?

`

<div class="dropdown">

<button

class="
btn
btn-sm
border-0
shadow-none
text-muted
"

data-bs-toggle="dropdown"

>

<i class="
fa-solid
fa-ellipsis-vertical
"></i>

</button>

<ul class="
dropdown-menu
dropdown-menu-end
shadow
border-0
">

<li>

<a

class="
dropdown-item
"

href="javascript:void(0)"

onclick="
abrirEditarResena(${r.id})
"

>

Editar

</a>

</li>

<li>

<a

class="
dropdown-item
text-danger
"

href="javascript:void(0)"

onclick="
eliminarResena(${r.id})
"

>

Eliminar

</a>

</li>

</ul>

</div>

`

:

''
}

</div>

</p>

</div>

`;

});

contenedor.innerHTML = html;

}

/* =====================================
   SESION
===================================== */

async function verificarSesion(){

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/sesion-actual',

{
credentials:'include'
}

);

const datos =
await respuesta.json();

const contenedor =
document.getElementById(
'contenedorFormulario'
);

/* USUARIO */
if(datos.logueado){

usuarioActual =
datos.usuario;

}

/* NO LOGIN */
if(!datos.logueado){

contenedor.innerHTML = `

<div class="
alert
alert-warning
text-center
">

Debes iniciar sesión para escribir una reseña.

</div>

`;

return;

}

/* FORMULARIO */
contenedor.innerHTML = `

<form

id="formularioResena"

class="
card
p-3
mb-3
"

>

<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="calificacion"

class="form-select"

required

>

<option value="">
Selecciona una opción
</option>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="comentario"

class="form-control"

rows="4"

required

></textarea>

</div>

<div class="text-end">

<button class="
btn
btn-primary
">

Enviar reseña

</button>

</div>

</form>

`;

/* EVENTO */
document.getElementById(
'formularioResena'
).onsubmit = null;

document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/crear-resena-hotel',

{

method:'POST',

credentials:'include',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

item_id:id,

calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

e.target.reset();

cargarResenas();

}

else{

alert(
resultado.mensaje
);

}

}

);

}

/* =====================================
   ELIMINAR RESEÑA
===================================== */

async function eliminarResena(id){

try{

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/eliminar-resena',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({
id:id,
tipo:'hotel'
})

}

);

const resultado =
await respuesta.json();

console.log(resultado);

/* OK */
if(resultado.ok){

cargarResenas();

}

/* ERROR */
else{

alert(
'No se pudo eliminar'
);

}

}catch(error){

console.log(error);

}

}

/* =====================================
   ABRIR EDITAR
===================================== */

function abrirEditarResena(
id
){

const resena =
window.listaResenas.find(
r=>r.id == id
);

if(!resena){
return;
}

/* ID */
document.getElementById(
'editarResenaId'
).value =
resena.id;

/* CALIFICACION */
document.getElementById(
'editarCalificacion'
).value =
resena.calificacion;

/* COMENTARIO */
document.getElementById(
'editarComentario'
).value =
resena.comentario;

/* MODAL */
const modal =
new bootstrap.Modal(

document.getElementById(
'modalEditarResena'
)

);

modal.show();

}

/* =====================================
   GUARDAR EDICION
===================================== */

async function guardarEditarResena(){

try{

const respuesta =
await fetch(

'https://visita-quibdo2.onrender.com/editar-resena',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

id:
document.getElementById(
'editarResenaId'
).value,

tipo:'hotel',

calificacion:
document.getElementById(
'editarCalificacion'
).value,

comentario:
document.getElementById(
'editarComentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

/* CERRAR */
bootstrap.Modal
.getInstance(

document.getElementById(
'modalEditarResena'
)

).hide();

/* RECARGAR */
cargarResenas();

}

}catch(error){

console.log(error);

}

}

/* =====================================
   INICIAR
===================================== */

cargarHotel();

cargarResenas();

verificarSesion();

</script>

</body>
</html>
