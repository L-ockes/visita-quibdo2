<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>

Recuperar Contraseña

</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

</head>

<body class="
bg-light
d-flex
justify-content-center
align-items-center
vh-100
">

<div class="
card
shadow
p-4
"
style="
width:400px;
"
>

<h3 class="
text-center
text-primary
mb-4
">

Recuperar Contraseña

</h3>

<form

id="formularioRecuperar"

autocomplete="off"

>

<div class="mb-3">

<label class="form-label">

Correo electrónico

</label>

<input

type="email"

autocomplete="off"

id="correo"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">

Nueva contraseña

</label>

<input

type="password"

autocomplete="new-password"

id="nueva"

class="form-control"

required

>

</div>

<div class="mb-3">

<label class="form-label">

Confirmar contraseña

</label>

<input

type="password"

autocomplete="new-password"

id="confirmar"

class="form-control"

required

>

</div>

<button class="
btn
btn-primary
w-100
">

Cambiar Contraseña

</button>

<div
id="mensaje"
class="
mt-3
text-center
"
></div>

</form>

</div>

<script>

document.getElementById(

'formularioRecuperar'

)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const correo =
document.getElementById(
'correo'
).value;

const nueva =
document.getElementById(
'nueva'
).value;

const confirmar =
document.getElementById(
'confirmar'
).value;

if(
nueva !== confirmar
){

document.getElementById(
'mensaje'
).innerHTML = `

<div class="
alert
alert-danger
">

Las contraseñas no coinciden

</div>

`;

return;

}

const respuesta =
await fetch(

'http://localhost:3000/recuperar-password',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

correo,
nueva,
confirmar

})

}

);

const datos =
await respuesta.json();

const mensaje =
document.getElementById(
'mensaje'
);

if(datos.ok){

mensaje.innerHTML = `

<div class="
alert
alert-success
">

Contraseña actualizada

</div>

`;

setTimeout(()=>{

window.location.href =
'login.html';

},2000);

}

else{

mensaje.innerHTML = `

<div class="
alert
alert-danger
">

${datos.mensaje}

</div>

`;

}

}

);

</script>

</body>

</html>
