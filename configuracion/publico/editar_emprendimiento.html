/* =====================================
   CONTENEDOR IMAGEN

/* =====================================
   IMAGEN PRINCIPAL
===================================== */

width:100%;
height:100%;

transform 0.2s ease;

/* =====================================
   MINIATURAS
===================================== */

min-width:120px;
height:120px;

cursor:pointer;

overflow:hidden;

border-radius:20px;

border:2px solid #dee2e6;

background:#f8f9fa;

display:flex;

align-items:center;

justify-content:center;

position:relative;

transition:0.3s;

.miniatura:hover{

}

width:100%;
height:100%;
object-fit:cover;

/* =====================================
   BOTON ELIMINAR
===================================== */

.eliminar-btn{

width:24px;
height:24px;

border:none;

border-radius:50%;

rgba(0,0,0,0.6);

color:white;

right:6px;

rgba(220,53,69,0.9);

<body>

<!-- NAVBAR -->

<!-- CONTENIDO -->

<h2 class="
text-primary
fw-bold
text-center
mb-4
">

Editar Emprendimiento

</h2>

<div
id="editorEmprendimiento"
></div>

</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- TOAST -->

<div

id="toastGuardado"

class="
position-fixed
top-0
end-0
p-3
"

style="
z-index:9999;
"

>

<div

class="
toast
align-items-center
text-bg-success
border-0
shadow-lg
"

role="alert"

id="toastContenido"

>

<div class="
d-flex
">

<div class="
toast-body
fw-semibold
">

✅ Cambios guardados correctamente

</div>

<button

type="button"

class="
btn-close
btn-close-white
me-2
m-auto
"

></button>

</div>

</div>

<!-- SCRIPTS -->
<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* =====================================
   VARIABLES
===================================== */

let emprendimiento = null;

let imagenes = [];

let nuevasImagenes = [];

let limiteImagenes = 5;

/* PARAMETROS */
const parametros =

new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');

/* =====================================
   TOAST
===================================== */

function mostrarToast(){

const toastElemento =

document.getElementById(
'toastContenido'
);

const toast =

new bootstrap.Toast(
toastElemento,
{
delay:2000
}
);

toast.show();

}

/* =====================================
   CARGAR DATOS
===================================== */

async function cargarDatos(){

try{

/* FETCH */
const respuesta =
await fetch(

'http://localhost:3000/editar-emprendimiento/' + id

)

const datos =
await respuesta.json();

/* VALIDAR */
if(
!datos.ok
||
!datos.tieneDatos
){

window.location.href =
'panel.html';

return;

}

/* EMPRENDIMIENTO */
emprendimiento =
datos.emprendimiento;

/* CARGAR HTML */
mostrarEditor();

/* CARGAR IMAGENES */
await cargarImagenes();

}catch(error){

console.log(error);

}

}

/* =====================================
   MOSTRAR HTML
===================================== */

document.getElementById(

).innerHTML = `

<div class="
card
border-0
shadow-lg
rounded-4

<!-- IMAGEN PRINCIPAL -->
<div class="

bg-white
">

<div
class="imagen-container"
id="contenedorZoom"
>

<img
id="imagenPrincipal"
src="${

?
'http://localhost:3000/' + emprendimiento.foto
:
'https://via.placeholder.com/1200x500?text=Sin+Imagen'
}"
>

</div>

<!-- CAMBIAR FOTO -->
<label

for="fotoPrincipal"

class="
btn
btn-light
position-absolute
top-0
end-0
m-3
rounded-circle
shadow
"

style="
width:60px;
height:60px;

display:flex;
align-items:center;
justify-content:center;
"

>

<i class="
fa-solid
fa-camera
fs-4
"></i>

</label>

<input

type="file"

id="fotoPrincipal"

accept="image/*"

hidden

>

</div>

<!-- MINIATURAS -->
<div

id="miniaturas"

class="
d-flex
gap-3
p-4
overflow-auto
"

>

</div>

<!-- FORMULARIO -->
<div class="p-4">

<div class="
row
g-4
">

<!-- =====================================
     NOMBRE
===================================== -->

<div class="
mb-4
">

<label class="
fw-bold
mb-2
">
Nombre del emprendimiento
</label>

<input

type="text"

id="nombre"

class="
form-control
"

value="
${emprendimiento.nombre_emprendimiento || ''}
"

>

</div>

<!-- CATEGORIA -->
<div class="col-md-6">

fw-bold
mb-2
">

</label>

<input

form-control

"

value="
${emprendimiento.categoria || ''}
"

>

</div>

<!-- UBICACION -->
<div class="col-md-6">

mb-2
">

</label>

<input

rounded-4

value="
${emprendimiento.ubicacion || ''}
"

>

</div>

<!-- HORARIOS -->
<div class="col-md-6">

<label class="
fw-bold
mb-2
">

Horarios

</label>

<input

type="text"

id="horarios"

class="
form-control
rounded-4
"

value="
${emprendimiento.horarios || ''}
"

>

</div>

<!-- SERVICIOS -->
<div class="col-md-6">

<label class="
fw-bold
mb-2
">

Servicios

</label>

<input

type="text"

id="servicios"

class="
form-control
rounded-4
"

value="
${emprendimiento.servicios || ''}
"

>

</div>

<!-- TELEFONO -->
<div class="col-md-6">

<label class="

mb-2
">

Teléfono

<input

<div class="col-12">

<label class="
fw-bold

"

${emprendimiento.descripcion || ''}

</textarea>

</div>

<!-- BOTON -->
<div class="col-12">

<button

id="guardarCambios"

class="
btn
btn-primary
w-100
py-3
rounded-4
fw-bold
"

>

Guardar Cambios

</button>

</div>

}

/* =====================================
   CARGAR IMAGENES
===================================== */

async function cargarImagenes(){

imagenes = [];

nuevasImagenes = [];

/* FETCH */
const respuesta =
await fetch(

`http://localhost:3000/imagenes-emprendimiento/${emprendimiento.id}`

);

const imagenesDB =
await respuesta.json();

/* EXTRA */
imagenesDB.forEach(img=>{

imagenes.push({

id:img.id,

tipo:'extra',

src:
'http://localhost:3000/' +
img.imagen,

ruta:
img.imagen

});

});

/* MAXIMO */
while(imagenes.length < limiteImagenes){

imagenes.push(null);

}

/* MOSTRAR */
mostrarMiniaturas();

}

/* =====================================
   MOSTRAR MINIATURAS
===================================== */

function mostrarMiniaturas(){

const contenedor =
document.getElementById(
'miniaturas'
);

contenedor.innerHTML = '';

imagenes.forEach(

(imagen,index)=>{

contenedor.innerHTML += `

<div

class="
miniatura
"

onclick="
seleccionarImagen(${index})
"

>

${
imagen

?

`

<img

src="${imagen.src}"

>

<button

type="button"

class="
position-absolute
top-0
end-0
eliminar-btn
"

onclick="
event.stopPropagation();
eliminarImagen(${index});
"

>

<i class="
fa-solid
fa-xmark
"></i>

</button>

`

:

`

<div class="
text-center
">

<i class="
fa-solid
fa-image
text-secondary
fs-1
mb-2
"></i>

<p class="
small
text-muted
mb-0
">

Agregar

</p>

</div>

`
}

</div>

`;

}

);

}

/* =====================================
   SELECCIONAR IMAGEN
===================================== */

function seleccionarImagen(index){

const imagen =
imagenes[index];

/* EXISTE */
if(imagen){

document.getElementById(
'imagenPrincipal'
).src = imagen.src;

}

/* VACIA */
else{

const input =
document.createElement(
'input'
);

input.type = 'file';

input.accept = 'image/*';

input.onchange =
function(evento){

const archivo =
evento.target.files[0];

if(!archivo){

return;

}

const lector =
new FileReader();

lector.onload =
function(e){

/* GUARDAR */
imagenes[index] = {

tipo:'nueva',

src:e.target.result

};

nuevasImagenes[index] =
archivo;

/* MOSTRAR */
mostrarMiniaturas();

/* PRINCIPAL */
document.getElementById(
'imagenPrincipal'
).src =
e.target.result;

};

lector.readAsDataURL(
archivo
);

};

input.click();

}

}

/* =====================================
   ELIMINAR IMAGEN
===================================== */

async function eliminarImagen(index){

const imagen =
imagenes[index];

/* MYSQL */
if(
imagen
&&
imagen.id
){

try{

const respuesta =
await fetch(

'http://localhost:3000/eliminar-imagen-emprendimiento/' + imagen.id,

{
method:'DELETE'
}

);

const resultado =
await respuesta.json();

if(!resultado.ok){

alert(
'Error eliminando imagen'
);

return;

}

}catch(error){

console.log(error);

alert(
'Error servidor'
);

return;

}

}

/* BORRAR VISUAL */
imagenes[index] = null;

nuevasImagenes[index] = null;

/* RECARGAR */
mostrarMiniaturas();

/* LIMPIAR */
document.getElementById(
'imagenPrincipal'
).src =
'https://via.placeholder.com/1200x500?text=Sin+Imagen';

}
/* =====================================
   CAMBIAR FOTO PRINCIPAL
===================================== */

document.addEventListener(

'change',

function(evento){

if(
evento.target.id ===
'fotoPrincipal'
){

const archivo =
evento.target.files[0];

if(!archivo){

return;

}

const lector =
new FileReader();

lector.onload =
function(e){

document.getElementById(
'imagenPrincipal'
).src =
e.target.result;

};

lector.readAsDataURL(
archivo
);

}

}
);

/* =====================================
   GUARDAR
===================================== */

document.addEventListener(

'click',

async function(evento){

if(
evento.target.id ===
'guardarCambios'
){

try{

const datos =
new FormData();

/* ID */
datos.append(
'id',
id
);

/* CAMPOS */
datos.append(
'nombre_emprendimiento',
document.getElementById(
'nombre'
).value

);
datos.append(
'categoria',
document.getElementById(
'categoria'
).value
);

datos.append(
'ubicacion',
document.getElementById(
'ubicacion'
).value
);

datos.append(
'horarios',
document.getElementById(
'horarios'
).value
);

datos.append(
'servicios',
document.getElementById(
'servicios'
).value
);

datos.append(
'telefono',
document.getElementById(
'telefono'
).value
);

datos.append(
'descripcion',
document.getElementById(
'descripcion'
).value
);

/* FOTO PRINCIPAL */
const fotoPrincipal =
document.getElementById(
'fotoPrincipal'
).files[0];

if(fotoPrincipal){

datos.append(
'foto',
fotoPrincipal
);

}

/* EXTRA */
nuevasImagenes.forEach(img=>{

if(img){

datos.append(
'imagenes_extra',
img
);

}

});

/* FETCH */
const respuesta =
await fetch(

'http://localhost:3000/editar-emprendimiento',

{

method:'POST',

body:datos

}

);

const resultado =
await respuesta.json();
console.log(resultado);

/* MENSAJE */
if(resultado.ok){

mostrarToast();

}else{

alert(
resultado.mensaje
);

}

}
catch(error){

console.log(
'ERROR COMPLETO:',
error
);

alert(
error
);

}

}

}
);

/* =====================================
   ZOOM MERCADO LIBRE
===================================== */

const contenedor =
document.getElementById(
'contenedorZoom'
);

const imagen =
document.getElementById(
'imagenPrincipal'
);

!contenedor
||
!imagen
){

return;

}

const rect =
contenedor.getBoundingClientRect();

const x =
e.clientX - rect.left;

const y =
e.clientY - rect.top;

const dentro =

x >= 0
&&

&&

&&

if(dentro){

const posX =
(x / rect.width) * 100;

const posY =

imagen.style.transform =
'scale(2)';

imagen.style.transformOrigin =

}else{

});

async function cargarPlan(){

    try{

        const respuesta =
        await fetch(

            'http://localhost:3000/perfil',

            {
                credentials:'include'
            }

        );

        const usuario =
        await respuesta.json();

        if(
            usuario.plan === 'premium'
            &&
            usuario.estado_pago === 'activo'
        ){

            limiteImagenes = 15;

        }

        cargarDatos();

    }catch(error){

        console.log(error);

        cargarDatos();

    }

}

/* =====================================
   INICIAR
===================================== */

cargarPlan();

</script>
