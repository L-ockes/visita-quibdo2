</h2>

<!-- RESEÑAS -->
<div class="

mt-5
">

<div class="col-12">

<div id="seccionResenas">

<h4 class="
fw-bold
mb-3
"
style="
color:#111827;
"
>

Calificaciones y comentarios

</h4>
</div>
<div
class="
alert
alert-warning
d-none
mb-3
"
>



</div>

id="mensajeLogin"

alert-warning
d-none

"

"

<div class="

">

">

></div>

</div>

<!-- COMENTARIOS -->

<!-- =====================================
     MODAL EDITAR RESEÑA
===================================== -->

<div
class="
modal
fade
"
id="modalEditarResena"
tabindex="-1"
>

<div class="
modal-dialog
modal-dialog-centered
">

<div class="
modal-content
border-0
shadow
rounded-4
">

<div class="
modal-header
border-0
">

<h5 class="
modal-title
fw-bold
text-primary
">

Editar reseña

</h5>

<button

type="button"

class="btn-close"

data-bs-dismiss="modal"

></button>

</div>

<div class="
modal-body
">

<input
type="hidden"
id="editarResenaId"
>

<div class="mb-3">

<label class="form-label">
Calificación
</label>

<select

id="editarCalificacion"

class="form-select"

>

<option value="5">
5 estrellas
</option>

<option value="4">
4 estrellas
</option>

<option value="3">
3 estrellas
</option>

<option value="2">
2 estrellas
</option>

<option value="1">
1 estrella
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Comentario
</label>

<textarea

id="editarComentario"

class="form-control"

rows="4"

></textarea>

</div>

</div>

<div class="
modal-footer
border-0
">

<button

class="
btn
btn-secondary
"

data-bs-dismiss="modal"

>

Cancelar

</button>

<button

class="
btn
btn-primary
"

onclick="
guardarEditarResena()
"

>

Guardar cambios

</button>

</div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script src="
https://unpkg.com/leaflet/dist/leaflet.js
"></script>

<script src="
https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js
"></script>

<script>

/* URL */
const parametros =
new URLSearchParams(
window.location.search
);

const id =
parametros.get('id');
let usuarioActual = null;

/* SESION */
async function verificarSesion(){

const respuesta =
await fetch(

'http://localhost:3000/sesion'

);

const datos =
await respuesta.json();

/* USUARIO */
if(datos.logueado){

usuarioActual =
datos.usuario;

}

/* NO LOGIN */
if(!datos.logueado){

document.getElementById(
'formularioResena'
).style.display =
'none';

document.getElementById(
'mensajeLogin'
).classList.remove(
'd-none'
);

}

}

verificarSesion();

let mapa;

/* DATOS */
async function cargarEvento(){

try{

const respuesta =
await fetch(

`http://localhost:3000/evento/${id}`

);

const datos =
await respuesta.json();

if(!datos.ok){

document.getElementById(
'titulo'
).innerHTML =
'Evento no encontrado';

return;

}

const e =
datos.evento;

window.nombreEvento =
e.titulo;

/* TITULO */
document.getElementById(
'titulo'
).innerHTML =
e.titulo;

/* IMAGEN */
document.getElementById(
'imagenPrincipal'
).src =

e.imagen

?

e.imagen

:

'https://via.placeholder.com/700x450?text=Evento';

/* INFORMACION */
document.getElementById(
'info'
).innerHTML = `

<div
id="descripcion"
class="
card
shadow-sm
border-0
rounded-4
p-4
mb-4
"
>

<h4
class="fw-bold mb-3"
style="color:#111827;"
>

Descripción

</h4>

<p class="mb-0">

${e.descripcion || 'No disponible'}

</p>

</div>

<div
id="fecha"
class="
card
shadow-sm
border-0
rounded-4
p-4
mb-4
"
>

<h4
class="fw-bold mb-3"
style="color:#111827;"
>

Fecha y hora

</h4>

<p>

📅
${new Date(e.fecha).toLocaleDateString('es-CO')}

</p>

<p>

🕒
${e.hora || 'No disponible'}

</p>

</div>

<div
id="lugarEvento"
class="
card
shadow-sm
border-0
rounded-4
p-4
mb-4
"
>

<h4
class="fw-bold mb-3"
style="color:#111827;"
>

Lugar

</h4>

<p>

📍
${e.lugar || 'No disponible'}

</p>

</div>

`;

/* MAPA */
if(
e.latitud &&
e.longitud
){

mapa = L.map('mapa').setView(
[
e.latitud,
e.longitud
],
15
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}
).addTo(mapa);

navigator.geolocation.getCurrentPosition(

(posicion)=>{

const latUsuario =
posicion.coords.latitude;

const lngUsuario =
posicion.coords.longitude;

L.marker(
[
e.latitud,
e.longitud
]
)

.addTo(mapa)

.bindPopup(
e.titulo
)

.openPopup();

L.marker(
[
latUsuario,
lngUsuario
]
)

.addTo(mapa)

.bindPopup(
'Tu ubicación'
);

L.Routing.control({

waypoints:[

L.latLng(
latUsuario,
lngUsuario
),

L.latLng(
e.latitud,
e.longitud
)

],

routeWhileDragging:false,

show:true,

addWaypoints:false,

draggableWaypoints:false,

fitSelectedRoutes:true

})

.addTo(mapa);

}

);

}else{

document.getElementById(
'mapa'
).style.display =
'none';

}
}catch(error){

console.log(error);

}

}

async function cargarGaleriaEvento(){

    try{

        const respuesta =
        await fetch(
        'http://localhost:3000/imagenes-evento/' + id
        );

        const datos =
        await respuesta.json();

        if(!datos.ok){
            return;
        }

        const miniaturas =
        document.getElementById(
        'miniaturas'
        );

        miniaturas.innerHTML = '';

        datos.imagenes.forEach(img=>{

            const imagen =
            document.createElement('img');

            imagen.src =
            'http://localhost:3000/' +
            img.imagen;

            imagen.onclick = ()=>{

                document.getElementById(
                'imagenPrincipal'
                ).src =
                imagen.src;

            };

            miniaturas.appendChild(
            imagen
            );

        });

    }catch(error){

        console.log(error);

    }

}

(async()=>{

    await cargarEvento();

    await cargarGaleriaEvento();

    cargarResenas();

})();

/* RESEÑAS */
async function cargarResenas(){

try{

const respuesta =
await fetch(

'http://localhost:3000/resenas-evento/' + id

);

const resenas =
await respuesta.json();
window.listaResenas =
resenas;

const contenedor =
document.getElementById(
'resenas'
);

/* LIMPIAR */
contenedor.innerHTML = '';

/* PROMEDIO */
let promedio = 0;

resenas.forEach(r=>{

promedio += Number(
r.calificacion
);

});

if(resenas.length > 0){

promedio =
(
promedio /
resenas.length
).toFixed(1);

document.getElementById(
'titulo'
).innerHTML =

window.nombreEvento;

}

/* CONTADORES */
let cinco = 0;
let cuatro = 0;
let tres = 0;
let dos = 0;
let uno = 0;

/* CONTAR */
resenas.forEach(r=>{

if(r.calificacion == 5) cinco++;
if(r.calificacion == 4) cuatro++;
if(r.calificacion == 3) tres++;
if(r.calificacion == 2) dos++;
if(r.calificacion == 1) uno++;

});

/* PORCENTAJE */
function porcentaje(valor){

return (
valor / resenas.length
) * 100;

}

/* ESTRELLAS */
function estrellasAzules(){

let html = '';

for(let i=1; i<=5; i++){

html += `
<i
class="fa-solid fa-star"
style="
color:#3483FA;
font-size:20px;
"
></i>
`;

}

return html;

}

/* CAJA */
document.getElementById(
'calificacionBox'
).innerHTML = `

<div
class="mx-auto text-start"
style="
max-width:420px;
"
>

<h4 class="
fw-bold
mb-4
">

Reseñas del evento

</h4>

<div class="
d-flex
align-items-center
gap-3
mb-4
">

<div style="
font-size:60px;
font-weight:300;
color:#3483FA;
line-height:1;
">

${promedio}

</div>

<div>

<div class="mb-1">

${estrellasAzules()}

</div>

<div style="
color:#777;
font-size:14px;
">

${resenas.length}
calificaciones

</div>

</div>

</div>

${crearBarra(5, cinco)}
${crearBarra(4, cuatro)}
${crearBarra(3, tres)}
${crearBarra(2, dos)}
${crearBarra(1, uno)}

</div>

`;

/* BARRAS */
function crearBarra(
numero,
cantidad
){

return `

<div class="
d-flex
align-items-center
gap-2
mb-2
">

<div style="
width:15px;
font-size:14px;
color:#555;
">

${numero}

</div>

<div style="
flex:1;
height:8px;
background:#E5E5E5;
border-radius:20px;
overflow:hidden;
">

<div style="
width:${porcentaje(cantidad)}%;
height:100%;
background:#3483FA;
border-radius:20px;
">

</div>

</div>

<div style="
color:#999;
font-size:14px;
">

★

</div>

</div>

`;

}

/* VACIO */
if(resenas.length === 0){

contenedor.innerHTML = `

<p class="
text-muted
">

Aún no hay reseñas

</p>

`;

return;

}

/* MOSTRAR */
let html = '';

resenas.forEach(r=>{

html += `

<div class="
list-group-item
shadow-sm
mb-3
rounded
">

<div class="
d-flex
justify-content-between
align-items-center
mb-2
">

<strong>

${r.nombre || 'Anónimo'}

</strong>

<span

style="
color:#3483FA;
font-weight:700;
font-size:15px;
"
>

${r.calificacion} ★

</span>

</div>

<p class="
mb-1
">

${r.comentario}

</p>

<div class="
d-flex
justify-content-between
align-items-center
mt-2
">

<small class="
text-muted
">

${new Date(
r.creado_en
).toLocaleString()}

</small>

${
usuarioActual
&&
Number(usuarioActual.id)
===
Number(r.usuario_id)

?

`

<div class="dropdown">

<button

class="
btn
btn-sm
border-0
shadow-none
text-muted
"

data-bs-toggle="dropdown"

>

<i class="
fa-solid
fa-ellipsis-vertical
"></i>

</button>

<ul class="
dropdown-menu
dropdown-menu-end
shadow
border-0
">

<li>

<a

class="
dropdown-item
"

href="javascript:void(0)"

onclick="
abrirEditarResena(${r.id})
"

>

Editar

</a>

</li>

<li>

<a

class="
dropdown-item
text-danger
"

href="javascript:void(0)"

onclick="
eliminarResena(${r.id})
"

>

Eliminar

</a>

</li>

</ul>

</div>

`

:

''
}

</div>
</div>

`;

});

contenedor.innerHTML = html;

}catch(error){

console.log(error);

}

}

cargarResenas();

/* ENVIAR */
document.getElementById(
'formularioResena'
).onsubmit = null;

document.getElementById(
'formularioResena'
)

.addEventListener(

'submit',

async (e)=>{

e.preventDefault();

const respuesta =
await fetch(

'http://localhost:3000/crear-resena-evento',

{

method:'POST',

headers:{

'Content-Type':
'application/json'

},

body:JSON.stringify({

item_id:id,



calificacion:
document.getElementById(
'calificacion'
).value,

comentario:
document.getElementById(
'comentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

e.target.reset();

cargarResenas();

}

}

);

/* =====================================
   ELIMINAR RESEÑA
===================================== */

async function eliminarResena(id){

try{

const respuesta =
await fetch(

'http://localhost:3000/eliminar-resena',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({
id:id,
tipo:'evento'
})

}

);

const resultado =
await respuesta.json();

console.log(resultado);

/* OK */
if(resultado.ok){

cargarResenas();

}

/* ERROR */
else{

alert(
'No se pudo eliminar'
);

}

}catch(error){

console.log(error);

}

}

/* =====================================
   ABRIR EDITAR
===================================== */

function abrirEditarResena(
id
){

const resena =
window.listaResenas.find(
r=>r.id == id
);

if(!resena){
return;
}

/* ID */
document.getElementById(
'editarResenaId'
).value =
resena.id;

/* CALIFICACION */
document.getElementById(
'editarCalificacion'
).value =
resena.calificacion;

/* COMENTARIO */
document.getElementById(
'editarComentario'
).value =
resena.comentario;

/* MODAL */
const modal =
new bootstrap.Modal(

document.getElementById(
'modalEditarResena'
)

);

modal.show();

}

/* =====================================
   GUARDAR EDICION
===================================== */

async function guardarEditarResena(){

try{

const respuesta =
await fetch(

'http://localhost:3000/editar-resena',

{

method:'POST',

credentials:'include',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

id:
document.getElementById(
'editarResenaId'
).value,

tipo:'evento',

calificacion:
document.getElementById(
'editarCalificacion'
).value,

comentario:
document.getElementById(
'editarComentario'
).value

})

}

);

const resultado =
await respuesta.json();

if(resultado.ok){

/* CERRAR */
bootstrap.Modal
.getInstance(

document.getElementById(
'modalEditarResena'
)

).hide();

/* RECARGAR */
cargarResenas();

}

}catch(error){

console.log(error);

}

}

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
