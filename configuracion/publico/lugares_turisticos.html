<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Lugares Turísticos
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body class="
d-flex
flex-column
min-vh-100
">
<div id="navbar"></div>

<section class="hero-lugares">

    <div class="hero-overlay">

        <h1>
            Lugares Turísticos
        </h1>

        <p>
            Descubre los mejores destinos y atractivos turísticos de Quibdó
        </p>

        <div class="hero-search">

            <i class="fas fa-search"></i>

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar lugar turístico..."
            >

        </div>

    </div>

</section>

<div class="
container
py-5
flex-grow-1
">

<div
id="contenedor"
class="row"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>

<script>

/* LUGARES */
async function cargarLugares(){

const busqueda =
document.getElementById(
'busqueda'
).value;

const respuesta =
await fetch(

`http://localhost:3000/lugares?q=${busqueda}`

);

const lugares =
await respuesta.json();

const contenedor =
document.getElementById(
'contenedor'
);

/* VACIO */
if(lugares.length === 0){

contenedor.innerHTML = `

<p class="
text-center
text-muted
">

No hay lugares registrados

</p>

`;

return;

}

/* LIMPIAR */
contenedor.innerHTML = '';

/* MOSTRAR */
lugares.forEach(l=>{

contenedor.innerHTML += `

<div class="
col-md-4
mb-4
">

<div class="
card
shadow
h-100
">

<img

src="
${

l.imagen

?

l.imagen

:

'https://via.placeholder.com/400x220?text=Sin+Imagen'

}
"

class="card-img-top"

style="
height:220px;
object-fit:cover;

"

>

<div class="card-body">

<h5 class="
card-title
fw-bold
d-flex
align-items-center
gap-2
flex-wrap
"
style="
color:#111827;
"
>

${l.nombre}

${
l.total_resenas > 0

?

`

<span style="
color:#3483FA;
font-size:15px;
font-weight:700;
">

★ ${l.promedio_resenas}

</span>

<span style="
color:#777;
font-size:14px;
font-weight:400;
">

(${l.total_resenas})

</span>

`

:

''
}

</h5>

<p class="card-text">

${

l.descripcion

?

l.descripcion.substring(0,80)

:

''

}...

</p>

<p class="
text-muted
small
">

📍
${l.direccion || 'Dirección no disponible'}

</p>

<a

href="
ver_lugar.html?id=${l.id}
"

class="
btn
btn-detalle
w-100
"

>

Ver más

</a>

</div>

</div>

</div>

`;

});

}

cargarLugares();

/* ENTER */
document.getElementById(
'busqueda'
)

.addEventListener(
'input',
cargarLugares
);

/* LIMPIAR BUSQUEDA */
document.getElementById(
'busqueda'
)

.addEventListener(

'input',

function(){

if(
this.value.trim() === ''
){

cargarLugares();

}

}

);

async function cargarBanner(){

    try{

        const respuesta =
        await fetch(
        'http://localhost:3000/banner/lugares'
        );

        const datos =
        await respuesta.json();

        if(
        datos.ok &&
        datos.imagen
        ){

            document
            .querySelector(
            '.hero-lugares'
            )
            .style.background =

            `linear-gradient(
                rgba(0,0,0,.55),
                rgba(0,0,0,.55)
            ),
            url('http://localhost:3000/${datos.imagen}') center/cover`;

        }

    }catch(error){

        console.log(error);

    }

}

cargarBanner();

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>
</html>
