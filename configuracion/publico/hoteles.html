<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Hoteles - Visita Quibdó
</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="styles.css"
>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

</head>

<body class="
d-flex
flex-column
min-vh-100
">

<div id="navbar"></div>

<section class="hero-hoteles">

    <div class="hero-overlay">

        <h1>
            Hoteles
        </h1>

        <p>
            Encuentra los mejores hoteles para tu estadía en Quibdó
        </p>

        <div class="hero-search">

            <i class="fas fa-search"></i>

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar hotel..."
            >

        </div>

    </div>

</section>

<div class="
container
py-5
flex-grow-1
">

<div
class="row"
id="contenedor"
></div>

</div>

<div id="footer"></div>

<script src="navbar.js"></script>

<script src="footer.js"></script>

<script>

async function cargarHoteles(
termino = ''
){

const respuesta =

await fetch(

`http://localhost:3000/hoteles?q=${termino}`

);

const hoteles =
await respuesta.json();

let html = '';

/* VACIO */
if(hoteles.length === 0){

html = `

<p class="
text-center
text-muted
">

No hay hoteles.

</p>

`;

}

/* MOSTRAR */
hoteles.forEach(hotel => {

html += `

<div class="
col-md-4
mb-4
">

<div class="
card
shadow
h-100
">

<img

src="
${
hotel.imagen

?

'http://localhost:3000/' + hotel.imagen

:

'https://via.placeholder.com/400x220?text=Sin+Imagen'
}
"

class="
card-img-top
"

style="
height:220px;
object-fit:cover;
"

>

<div class="
card-body
d-flex
flex-column
">

<h5 class="
card-title
text-primary
fw-bold
d-flex
align-items-center
gap-2
flex-wrap
">

${hotel.nombre}

${
hotel.total_resenas > 0

?

`

<span class="
badge
bg-warning
text-dark
">

${hotel.promedio_resenas} ★
(${hotel.total_resenas})

</span>

`

:

''

}

</h5>

<p class="card-text">

${
hotel.descripcion
?.substring(0,100)
|| ''
}...

</p>

<p class="
text-muted
small
mb-1
">

📍 ${hotel.direccion || ''}

</p>

<p class="
small
mb-1
text-warning
fw-bold
">

⭐ ${hotel.estrellas || '0'}

</p>

<p class="
small
mb-1
">

📞 ${hotel.telefono || 'No disponible'}

</p>

<p class="
small
text-muted
mb-3
">

🧭 ${hotel.indicaciones || 'Sin indicaciones'}

</p>

<a

href="
ver_hotel.html?id=${hotel.id}
"

class="
btn
btn-detalle
w-100
mt-auto
"

>

Ver más

</a>

</div>

</div>

</div>

`;

});

document.getElementById(
'contenedor'
).innerHTML = html;

}

/* CARGAR */
cargarHoteles();

/* BUSQUEDA */
document.getElementById(
'busqueda'
)

.addEventListener(
'input',
function(){

cargarHoteles(
this.value
);

}
);

/* LIMPIAR BUSQUEDA */
document.getElementById(
'busqueda'
)

.addEventListener(

'input',

function(){

if(
this.value.trim() === ''
){

cargarHoteles();

}

}

);

async function cargarBanner(){

    try{

        const respuesta =
        await fetch(
        'http://localhost:3000/banner/hoteles'
        );

        const datos =
        await respuesta.json();

        if(
        datos.ok &&
        datos.imagen
        ){

            document
            .querySelector(
            '.hero-hoteles'
            )
            .style.background =

            `linear-gradient(
                rgba(0,0,0,.55),
                rgba(0,0,0,.55)
            ),
            url('http://localhost:3000/${datos.imagen}') center/cover`;

        }

    }catch(error){

        console.log(error);

    }

}

cargarBanner();

</script>

<script src="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
"></script>

</body>

</html>
